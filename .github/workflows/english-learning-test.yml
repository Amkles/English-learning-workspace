name: english-learning

on:
  push:
    branches: [main]
    paths:
      - 'english-learning/**'
      - '.github/workflows/english-learning-test.yml'
  pull_request:
    paths:
      - 'english-learning/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: english-learning/cet6-daily

jobs:
  jsdom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 测试依赖里的 undici 用到 Node 22 的 zstd 接口，Node 20 会在 require 阶段直接报错
          node-version: '22'

      # index.html 是构建产物，仓库里已提交；这里再跑一次构建，
      # 确保 src/ 与 data/ 的改动没有把产物写成另一副样子。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 重建单文件产物
        run: python tools/build.py

      - name: 产物应与仓库中一致
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html 与 src/ 不一致，请本地跑 python tools/build.py 后提交"
            git diff --stat -- index.html
            exit 1
          fi

      - name: 安装测试依赖
        working-directory: english-learning/cet6-daily/tests
        run: npm ci

      - name: 解析用例
        working-directory: english-learning/cet6-daily/tests
        run: node parse.test.js

      - name: 抽取压测
        working-directory: english-learning/cet6-daily/tests
        run: node draw.test.js

      - name: 交互冒烟
        working-directory: english-learning/cet6-daily/tests
        run: node smoke.test.js
