name: pages

on:
  push:
    branches: [main]
    paths:
      - 'english-learning/cet6-daily/index.html'
      - 'academic-workspace/index.html'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 只发布入口页和两份单文件产物，不把 src/ data/ tests/ docs/ 一起挂到站点上
      - name: 准备站点目录
        run: |
          set -e
          mkdir -p _site/english-learning/cet6-daily _site/academic-workspace
          cp .github/pages/landing.html _site/index.html
          cp english-learning/cet6-daily/index.html _site/english-learning/cet6-daily/index.html
          cp academic-workspace/index.html _site/academic-workspace/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
