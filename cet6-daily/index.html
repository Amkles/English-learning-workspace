ing sounds like encouragement, but it is closer to a warning. Curiosity is not a fixed trait; it is a habit that can be trained or extinguished.\n\nA student who asks why a formula works will recognise its limits; one who only memorises it will apply it where it fails. Questions also drive the acquisition of knowledge, since an answer sticks better when it responds to something one wondered about.\n\nWhat extinguishes curiosity is usually the environment. A timetable with no empty space leaves no time to follow an interest, and an examination system that rewards the correct answer punishes the interesting question. Adults are also efficient: answering is faster than exploring a doubt.\n\nKeeping curiosity therefore requires small deliberate habits: writing questions in the margin instead of resolving them immediately, and following each answer one step further than required. The point is not to doubt everything, but to keep the door open.","ph":["closer to a warning 更接近于警告","a habit that can be trained or extinguished 可以被训练也可以被消磨的习惯","responds to something one actually wondered about 回应了自己真正好奇的东西","in the margin 在页边"]},{"id":"w059","tp":"名言评论","ti":"关于「比较」","dir":"Directions: Comment on the saying 'Comparison is the thief of joy.' Write an essay of 120 to 180 words.","ol":["解释比较为何偷走快乐","区分有害比较与有益比较","给出做法"],"fr":["第一段：释义，比较改变注意对象","第二段：参照系问题 + 有益比较的条件","第三段：做法（与自己比、控制信息源）"],"es":"The saying that comparison is the thief of joy identifies a mechanism rather than a moral failing. Comparison does not reduce what a person has; it changes what that person looks at.\n\nA student who has finished a difficult chapter sees a classmate's award, and the chapter stops counting. The reference group also shifts upward: once a person is surrounded by high achievers, an objectively good result feels ordinary.\n\nComparing your current work with your own earlier work is the basis of improvement, and comparing methods rather than outcomes can be instructive. The damage comes from comparing outcomes with people whose circumstances differ in ways the comparison ignores.\n\nThe practical response is to change the reference point and the input. Keep a record of what you did last month, and reduce the time spent on feeds that make other lives look effortless. Joy is not stolen by ambition but by a badly chosen mirror.","ph":["identifies a mechanism rather than a moral failing 指出的是一种机制，而非道德缺陷","reference group 参照群体","The damage comes from ... 伤害来自……","a badly chosen mirror 选错的镜子"]},{"id":"w060","tp":"名言评论","ti":"关于「勇气」","dir":"Directions: Comment on the saying 'Courage is not the absence of fear, but the ability to act in spite of it.' Write an essay of 120 to 180 words.","ol":["解释勇气的定义","说明恐惧的功能与过度","给出训练勇气的方法"],"fr":["第一段：释义，勇气是带着恐惧行动","第二段：恐惧的功能（预警）与过度（瘫痪）","第三段：方法（分步暴露、预案、榜样）"],"es":"The definition of courage as acting in spite of fear is more useful than the popular image of the fearless hero, because the fearless hero does not exist in ordinary life.\n\nFear has a function: it warns a person before a real risk and prepares the body to respond. The problem is that the same system responds to social risk — public speaking, disagreeing with a supervisor — with the same intensity as physical danger.\n\nCourage can therefore be trained in small steps. A student afraid of speaking can begin by asking one question in a seminar, then by presenting for three minutes, then by chairing a discussion. A written plan for the worst outcome also reduces fear, because vagueness is what makes it large.\n\nThe point is not to eliminate the feeling but to stop letting it decide. Courage is a decision made while the hands are still shaking.","ph":["in spite of 尽管","responds to social risk with the same intensity 以同样的强度回应社交风险","removes the opportunity 也去掉了机会","Vagueness is what makes it large. 让它变大的正是模糊。"]},{"id":"w061","tp":"对比选择","ti":"住宿舍还是租房","dir":"Directions: Some students live in dormitories, others rent flats outside campus. Which do you think is better for university students? Write an essay of 120 to 180 words.","ol":["提出比较标准（成本、社交、独立性）","比较两种选择","给出分阶段的建议"],"fr":["第一段：不宜一概而论，要看年级与专业","第二段：宿舍的优势与局限","第三段：租房的优势与风险 + 结论"],"es":"Should students live in a dormitory or rent a flat? The answer depends less on preference than on what a student needs at a particular stage.\n\nA first-year student who lives with five others learns about different provinces, different habits and different ways of studying, and the cost of a room is often a fifth of the market rate. The limitation is control: noise, schedules and storage are shared, and a single inconsiderate roommate can ruin a term.\n\nRenting offers privacy and a fixed routine, which matters for students preparing for a serious examination or working night shifts. It also teaches practical skills — contracts, bills, repairs. The risks are cost and isolation; a student who moves out in the first year may find that the friends were made without them.\n\nMy suggestion is therefore sequential: live in a dormitory for the first two years to build a network, then rent if a specific need appears.","ph":["socially dense 社交密度高","a fixed routine 固定的作息","matters for 对……重要","live in a dormitory for the first two years 前两年住宿舍"]},{"id":"w062","tp":"对比选择","ti":"读纸质书还是听有声书","dir":"Directions: Some people prefer printed books, others prefer audiobooks. Which do you prefer and why? Write an essay of 120 to 180 words.","ol":["说明选择取决于书的类型与目的","比较两种方式的优劣","给出自己的搭配方案"],"fr":["第一段：提出按目的分工","第二段：有声书的场景优势与记忆劣势","第三段：纸质书的优势 + 我的搭配"],"es":"Printed books or audiobooks? I use both, and the choice depends on what I want from the text.\n\nAudiobooks are excellent for certain situations. They fill the walk to the laboratory, the bus ride and the washing-up, time that would otherwise be empty. For narrative works — memoirs, popular history, novels — a good reader adds rhythm and emphasis that silent reading may miss. Their weakness is navigation: it is difficult to go back three pages to check a name, and difficult passages slide past while attention drifts.\n\nPrinted books, or their electronic equivalent, remain better for material that must be studied. Highlighting, marginal notes and the physical position of a paragraph all support memory, and the eye can move backwards as easily as forwards.\n\nMy arrangement is simple: listen to books that I could otherwise not finish, and read the ones I need to argue with. The format should serve the purpose, not become an identity.","ph":["The choice depends on what I want from the text 选择取决于我想从文本中得到什么","adds rhythm and emphasis 增加节奏与重音","slide past while attention drifts 在注意力游移时滑过去","argue with 与……辩驳（指精读）"]},{"id":"w063","tp":"对比选择","ti":"大班课还是小班课","dir":"Directions: Some students prefer large lectures, others prefer small classes. Which do you think is more effective? Write an essay of 120 to 180 words.","ol":["说明两者适合不同目标","比较大班与小班的效率差异","给出组合建议"],"fr":["第一段：分别定位（知识覆盖 / 能力训练）","第二段：大班的规模优势与互动缺失","第三段：小班的深度 + 结论"],"es":"Large lectures and small classes are not competing formats; they do different jobs.\n\nA lecture is an efficient way to deliver a framework. Three hundred students can hear a leading scholar explain how a field is organised, and the cost per student is low. The weakness is that understanding is assumed rather than checked: a student can follow every sentence and still be unable to use the idea a week later.\n\nA small class is expensive and slower, but it forces production. When twelve people must respond to a case, silence is not an option, and the instructor can see who has misunderstood. This is where skills such as argument and analysis actually develop.\n\nThe sensible design uses both: lectures for orientation, small classes for practice. If a student must choose only one, the small class offers more per hour, because the hours spent speaking are the hours that change what one can do.","ph":["do different jobs 承担不同职能","the cost per student is low 人均成本低","understanding is assumed rather than checked 理解被视为理所当然，而非被检验","offers more per hour 每小时收获更多"]},{"id":"w064","tp":"对比选择","ti":"独自学习还是小组学习","dir":"Directions: Some students study alone, others prefer group study. Which is more effective for you? Write an essay of 120 to 180 words.","ol":["区分任务类型","比较两种模式的效果","给出自己的组合方式"],"fr":["第一段：按任务分工","第二段：独自学习的深度与小组的纠错","第三段：我的做法（先独后组）"],"es":"Studying alone or in a group? The question is poorly framed, because the two modes suit different tasks.\n\nUnderstanding a difficult text requires uninterrupted time. In a group, the conversation moves at the speed of the fastest speaker, and a quiet member may leave believing she understood. Alone, a reader can stop at a paragraph for twenty minutes, which is often what comprehension requires.\n\nGroups are better at exposing error. When you explain a concept to a classmate, the part you cannot state clearly is the part you do not know. Groups also supply pressure: a scheduled session at seven in the evening is harder to skip than a private intention.\n\nMy own arrangement is sequential. I read and take notes alone, then meet once a week to teach what I have understood. The solitary session produces the material; the group session tests it. Neither is sufficient alone, and the order matters more than the choice.","ph":["The question is poorly framed 这个问题问得不好","moves at the speed of the fastest speaker 以最快者的速度推进","expose error 暴露错误","the order matters more than the choice 顺序比选择更重要"]},{"id":"w065","tp":"对比选择","ti":"国内读研还是出国读研","dir":"Directions: Some graduates pursue a master's degree at home, others go abroad. Which do you think is a better choice? Write an essay of 120 to 180 words.","ol":["提出判断维度（专业资源、成本、职业规划）","比较两条路径","给出条件性结论"],"fr":["第一段：取决于专业与目标","第二段：出国的收益与成本","第三段：国内的优势 + 结论"],"es":"Should a graduate study at home or abroad? The answer depends on the field and on where the student intends to work.\n\nGoing abroad offers access to laboratories, libraries and supervisors that may not exist domestically, and it forces a student to operate in a second language, which is itself training. The costs are substantial: tuition, living costs, and the risk that a degree earned abroad is undervalued by employers who cannot judge the institution.\n\nTuition is lower, the supervisor's network is local, and internships during the programme are easier to arrange. For fields where regulation and practice differ sharply between countries — law, public administration, clinical medicine — local training is often more directly useful.\n\nThe decision should therefore follow the work, not the prestige. If the research requires equipment available only in a few places, go where the equipment is. If the career will be built domestically, choose the programme that puts you in contact with domestic employers.","ph":["access to 获得……的机会","is itself training 本身就是一种训练","follow the work, not the prestige 依据工作而非名声做决定","put you in contact with 让你接触到"]},{"id":"w066","tp":"对比选择","ti":"先工作还是先读研","dir":"Directions: Some students pursue a master's degree immediately after graduation; others work for a few years first. Which do you think is wiser? Write an essay of 120 to 180 words.","ol":["说明两种路径的适用条件","比较信息与成本","给出建议"],"fr":["第一段：取决于是否需要先了解行业","第二段：先工作的收益与代价","第三段：直接读研的适用情形 + 结论"],"es":"Should a graduate continue studying immediately or work first? The deciding factor is whether the student knows what the degree is for.\n\nAfter two years in an industry, a person knows which problems are worth studying and which credentials actually matter. That knowledge makes a master's degree more focused and often more productive. The cost is momentum: salaries rise, obligations accumulate, and returning to a student schedule becomes harder each year.\n\nStudying first suits fields where the degree is a prerequisite rather than an upgrade — academic research, clinical practice, certain engineering specialisms. It also suits students whose undergraduate training was too general to enter the job they want.\n\nThe worst version of either path is the one chosen by default. A degree taken because one does not know what else to do delays the question without answering it, and a job taken only to avoid an examination teaches little. Choose the path that produces the information you currently lack.","ph":["supplies information that no career test can provide 提供任何职业测试都无法提供的信息","a prerequisite rather than an upgrade 是先决条件而非提升手段","chosen by default 默认选择的","the information you currently lack 你当前缺少的信息"]},{"id":"w067","tp":"对比选择","ti":"早起学习还是熬夜学习","dir":"Directions: Some students study early in the morning, others late at night. Which do you think is more efficient? Write an essay of 120 to 180 words.","ol":["承认个体差异","比较两种时段的学习质量","给出可执行建议"],"fr":["第一段：生物节律存在差异","第二段：早起的优势（干扰少、记忆巩固）","第三段：熬夜的代价 + 建议"],"es":"Early mornings or late nights? Individual body clocks differ, but the two periods are not equally good for study.\n\nThe morning has two structural advantages. Interruptions are rare, because messages and meetings arrive later. And sleep after learning supports consolidation, so material studied at night is retained better if reviewed the next morning.\n\nLate-night study has a real appeal. The house is quiet, and there is a pleasant sense of having finally caught up. The evidence, however, is unkind: after midnight, attention and judgement decline while confidence stays high, which is why errors made at that hour are often not noticed until the next day.\n\nA practical arrangement is to protect the first ninety minutes of the morning for the hardest task and to use the evening for review and routine work. If a student is genuinely a night person, the same principle applies: put the difficult task in the first hour after waking, whenever that is.","ph":["sleep after learning supports consolidation 学习后的睡眠有助于记忆巩固","The evidence, however, is unkind 然而证据并不留情","confidence stays high 自信仍然很高","protect the first ninety minutes 守住起床后的前九十分钟"]},{"id":"w068","tp":"对比选择","ti":"纸质笔记还是电子笔记","dir":"Directions: Some students take notes by hand, others type them. Which method do you think is better? Write an essay of 120 to 180 words.","ol":["比较记笔记的目的","比较两种方式的效果","给出搭配方案"],"fr":["第一段：记笔记的两个目的（记录、理解）","第二段：手写的理解优势","第三段：电子的检索优势 + 结论"],"es":"Handwritten notes or typed notes? The answer depends on which purpose of note-taking matters more in a given class.\n\nNotes serve two purposes: storing information and processing it. Typing is unbeatable for the first. A fast typist can record almost every sentence, and the file can be searched, reorganised and shared. The problem is that recording everything requires no thought, so the notes may be complete and the understanding shallow.\n\nWriting by hand is slow, and the slowness is the point. Unable to copy every word, the student must decide what matters, compress it and connect it to something already known. Research on recall consistently favours this effortful selection, especially for conceptual material.\n\nThe sensible combination is to write by hand in seminars and theory classes, where the structure matters, and to type in lectures that are essentially factual, where speed and searchability matter. The tool should follow the kind of thinking the class demands.","ph":["unbeatable for 在……方面无人能敌","the slowness is the point 慢正是关键","favour this effortful selection 支持这种费力的选择","searchability 可检索性"]},{"id":"w069","tp":"对比选择","ti":"参加社团还是专注学业","dir":"Directions: Some students join many student societies, others focus only on their studies. Which do you think is better? Write an essay of 120 to 180 words.","ol":["说明两者的收益性质不同","指出过度投入的风险","给出平衡方案"],"fr":["第一段：不是非此即彼","第二段：社团的不可替代收益","第三段：过度的代价 + 建议"],"es":"Should students join societies or concentrate on coursework? Framed as a choice, the question ignores that the two produce different kinds of capital.\n\nSocieties supply what classrooms rarely do: organising an event, negotiating with a venue, persuading someone who does not report to you. These experiences are difficult to acquire later and are valued by employers precisely because they cannot be taught from a textbook. A student who has run a fifty-person activity has learned something about failure that no lecture provides.\n\nThe risk is diffusion. A student in four organisations attends six meetings a week, holds two nominal titles and produces nothing substantial in any of them. The academic cost appears slowly, in the third year, when grades matter most.\n\nA workable rule is one serious role and one light membership. Depth in a single organisation teaches more than titles across four, and it leaves enough hours for the degree that will still be on the transcript.","ph":["produce different kinds of capital 产生不同种类的资本","someone who does not report to you 不归你管的人","diffusion 分散","nominal titles 名义上的头衔"]},{"id":"w070","tp":"对比选择","ti":"在校兼职还是专心学习","dir":"Directions: Some university students take part-time jobs, others spend all their time studying. Which do you think is better? Write an essay of 120 to 180 words.","ol":["区分兼职类型","比较收益与代价","给出条件性建议"],"fr":["第一段：兼职的质量差异很大","第二段：有价值的兼职特征","第三段：低价值兼职的代价 + 建议"],"es":"Should students take part-time jobs? The question cannot be answered without asking what kind of job, because part-time work ranges from tutoring that reinforces a subject to unpaid labour in a shop that teaches only endurance.\n\nA good part-time job has two features: it develops a skill the student wants, and it pays enough to be worth the hours. Tutoring, translation, laboratory assistance and internships in a target industry all meet this test.\n\nA poor part-time job consumes the hours that should go into study and returns money at a rate that will look small after graduation. The hidden cost is opportunity: the reading not done, the project not joined, the sleep not taken.\n\nThe reasonable rule is a ceiling — no more than twelve hours a week during term — and a purpose. If the job cannot be described in one sentence that would interest an employer or a supervisor, it is probably time sold too cheaply.","ph":["ranges from A to B 从 A 到 B 不等","meet this test 满足这一标准","The hidden cost is opportunity 隐性成本是机会","a ceiling 上限"]},{"id":"w071","tp":"对比选择","ti":"跟团游还是自由行","dir":"Directions: Some travellers prefer package tours, others prefer independent travel. Which do you prefer? Write an essay of 120 to 180 words.","ol":["比较两种方式的核心差异","分别说明适用人群","给出自己的选择与理由"],"fr":["第一段：不选边，按目的地与经验判断","第二段：跟团的价值（效率、安全）","第三段：自由行的价值 + 我的偏好"],"es":"Package tours or independent travel? The choice should follow the destination and the traveller rather than a general preference for freedom.\n\nTransport, tickets and language are handled, which matters in places where a missed connection ruins a week. It is also safer for inexperienced travellers and cheaper per day, because agencies buy in bulk. The cost is time: a schedule designed for forty people moves at the speed of the slowest, and shopping stops are rarely optional.\n\nIndependent travel is slower and less efficient, and that is precisely its value. A traveller who spends an extra afternoon in a small town because the light is good will remember it longer than a photograph taken from a bus window.\n\nMy own preference is independent travel with a fixed first night and a return ticket. Beyond those two anchors, plans should stay loose, because the best hours of a trip are usually the unplanned ones.","ph":["moves at the speed of the slowest 以最慢者的速度前进","buy in bulk 批量采购","precisely its value 正是它的价值","two anchors 两个锚点"]},{"id":"w072","tp":"对比选择","ti":"地铁还是自行车通勤","dir":"Directions: In cities, some people commute by subway, others by bicycle. Which do you think is better? Write an essay of 120 to 180 words.","ol":["比较距离、天气、成本三个维度","说明各自优势","给出组合方案"],"fr":["第一段：取决于距离与城市条件","第二段：地铁的稳定性","第三段：自行车的灵活与健康 + 组合"],"es":"Subway or bicycle? For most urban commuters the honest answer is both, depending on distance and weather.\n\nThe subway wins on reliability. It is unaffected by traffic and rain, and a journey of ten kilometres takes a predictable twenty-five minutes. Its weaknesses are crowding and access: the walk to the station and the wait on the platform are part of the commute.\n\nA bicycle is faster for distances under five kilometres, because it goes door to door and ignores one-way restrictions. It also inserts exercise into a part of the day that would otherwise be wasted, which is worth more than the money saved.\n\nThe practical arrangement is a bicycle for the short leg and the subway for the long one, with a folding bike or a shared bike at each end. Neither mode is superior; the mistake is to use one for every journey.","ph":["wins on reliability 在可靠性上胜出","goes door to door 门到门","inserts exercise into 把运动插入","the short leg 短途那一段"]},{"id":"w073","tp":"对比选择","ti":"背单词还是大量阅读","dir":"Directions: Some learners memorise word lists, others learn vocabulary through extensive reading. Which is more effective? Write an essay of 120 to 180 words.","ol":["指出两者解决不同问题","比较效率与深度","给出组合方法与比例"],"fr":["第一段：词汇学习有两个目标（广度、深度）","第二段：背单词的效率边界","第三段：阅读的作用 + 组合建议"],"es":"Word lists or extensive reading? The two methods solve different problems, and treating them as rivals produces poor results.\n\nA word list is efficient for breadth. A learner can meet 2,000 high-frequency words in a few months, which is enough to make simple texts readable. The limitation is that a word learned from a list is known in one context only: the learner recognises the definition but not the collocations that determine whether a sentence sounds natural.\n\nReading supplies exactly what lists cannot. A word encountered eight times in different sentences acquires grammar, connotation and partners. It also arrives with a reason to be remembered, which lists never provide.\n\nThe practical combination is a list for the first 3,000 words and reading for everything after. For an examination candidate, twenty words a day plus twenty minutes of reading is more effective than either alone, because one builds the base and the other builds the sense.","ph":["solve different problems 解决不同问题","known in one context only 只在一个语境中被认识","acquires grammar, connotation and partners 获得语法、色彩与搭配","builds the base 打好基础"]},{"id":"w074","tp":"对比选择","ti":"大公司还是创业公司","dir":"Directions: Some graduates prefer to work for large companies, others for start-ups. Which do you think is better for a first job? Write an essay of 120 to 180 words.","ol":["说明首份工作的核心目标","比较大公司与创业公司的培养方式","给出建议"],"fr":["第一段：首份工作主要买的是训练","第二段：大公司的体系化训练","第三段：创业公司的广度与风险 + 结论"],"es":"For a first job, should a graduate choose a large company or a start-up? The first job is mainly a purchase of training, so the question is where training is better.\n\nA large company teaches a method. A junior employee sees how a project is scoped, reviewed and documented, and learns standards that are difficult to acquire alone. The cost is narrowness: a new hire may spend a year on one small part of a process.\n\nA graduate may handle recruiting, customer support and product testing in the same month, and the results of a decision appear within weeks. The risk is the absence of a teacher: without a senior colleague, bad habits formed in the first year can persist for a decade.\n\nThe order that works for most people is a large company first, to learn how good work is done, then a smaller one, to apply it broadly. The reverse order is possible but harder to repair.","ph":["a purchase of training 一次对训练的购买","see how a project is scoped 看项目如何界定范围","The cost is narrowness 代价是视野狭窄","The reverse order is possible but harder to repair 反过来也可以，但更难弥补"]},{"id":"w075","tp":"对比选择","ti":"计划还是随性","dir":"Directions: Some people plan their days in detail, others prefer to stay flexible. Which do you think leads to a better life? Write an essay of 120 to 180 words.","ol":["辨析两种方式的适用场景","说明计划的收益与副作用","给出弹性计划的做法"],"fr":["第一段：不是性格问题，而是任务问题","第二段：计划降低启动成本","第三段：过度计划的代价 + 弹性方案"],"es":"Detailed planning or spontaneous flexibility? The choice is less about personality than about the kind of work a day contains.\n\nA student who has written 'seven to eight, listening practice' does not spend the first twenty minutes of the evening deciding what to do, and does not feel guilty while doing nothing. Planning also makes overload visible: a list with eleven hours of tasks on a six-hour day is an honest warning.\n\nA schedule with no gaps cannot absorb a phone call from a friend, a delayed bus or an idea worth following. And a plan that fails by ten in the morning often takes the whole day with it, because the day is judged lost rather than adjusted.\n\nThe middle path is a plan with three fixed blocks and deliberate empty space, reviewed at midday. Structure where it matters, slack where life happens. What matters is not the timetable but the ability to restart it.","ph":["removes decisions 省去决策","makes overload visible 让超载变得可见","cannot absorb 无法容纳","slack where life happens 在生活发生的地方留白"]},{"id":"w076","tp":"建议措施","ti":"如何提高英语口语","dir":"Directions: Many Chinese students can read English well but speak poorly. Write an essay suggesting how to improve spoken English. You should write 120 to 180 words.","ol":["点明问题：输入多、输出少","提出三条措施","说明坚持的关键"],"fr":["第一段：问题界定，不是词汇不足而是缺少输出","第二段：三条措施（固定口语时段、录音回听、真实交流）","第三段：执行要点（短而频繁）"],"es":"Many Chinese students read English comfortably yet freeze when they must speak. The problem is rarely vocabulary; it is the absence of practice in producing sentences under time pressure.\n\nThree measures help. First, set a daily ten-minute speaking slot in which no Chinese is allowed, even if the sentences are simple. Second, record yourself and listen once. Most learners are unaware of repeated fillers and flat intonation until they hear their own voice. Third, find one real conversation partner — a language exchange app, a classmate, a teacher's office hour — because speaking to a screen does not reproduce the pressure of being understood.\n\nWhat matters is frequency rather than duration. Twenty minutes twice a day builds the habit; a three-hour session on Sunday does not. Progress will feel slow for about six weeks, then suddenly audible in a recording. The method is unglamorous, but it is the only one that transfers to a real conversation.","ph":["freeze when they must speak 一到开口就卡住","under time pressure 在时间压力下","unaware of repeated fillers 没意识到重复的口头填充词","frequency rather than duration 频率而非时长"]},{"id":"w077","tp":"建议措施","ti":"如何减少食物浪费","dir":"Directions: Food waste is serious on many campuses. Write an essay suggesting how to reduce it. You should write 120 to 180 words.","ol":["描述浪费的规模与环节","从食堂、学生、制度三方面提措施","说明可行性"],"fr":["第一段：指出浪费集中在哪些环节","第二段：三条措施（份量可选、临期折扣、称重反馈）","第三段：为什么这些措施能落地"],"es":"On many campuses, food waste happens less in kitchens than on trays: rice left half-eaten, dishes ordered and abandoned. Reducing it requires changes at three points.\n\nFirst, canteens should offer two portion sizes at two prices. Most students do not intend to waste food; they simply cannot finish the standard portion. Second, unsold food near closing time should be discounted rather than discarded, with a clear time label so that freshness is not compromised. Third, some universities have begun weighing leftovers and publishing daily totals per canteen; visibility alone reduces waste, because no one wants to be the worst performer on a public board.\n\nStudent action matters too. A campaign that asks diners to order one dish fewer and add later if still hungry is easy to run and easy to follow.\n\nNone of these measures requires new technology. They require a decision to measure, and a willingness to make the smaller portion normal.","ph":["happens less in kitchens than on trays 与其说发生在厨房，不如说在餐盘上","near closing time 临近打烊","so that freshness is not compromised 以免影响新鲜度","make the smaller portion normal 让小份变成常态"]},{"id":"w078","tp":"建议措施","ti":"如何缓解考试焦虑","dir":"Directions: Many students suffer from exam anxiety. Write an essay suggesting ways to cope with it. You should write 120 to 180 words.","ol":["区分有益紧张与有害焦虑","提出三条可操作措施","强调早期干预"],"fr":["第一段：界定问题，焦虑的两种形态","第二段：措施（模拟考试、呼吸训练、认知重构）","第三段：何时寻求专业帮助"],"es":"Exam anxiety is not a single condition. A certain level of tension improves performance by focusing attention; the problem begins when physical symptoms — a racing heart, a blank mind — prevent a student from using what she knows.\n\nFirst, practise under the conditions of the real examination: same duration, same silence, no phone. Familiarity removes a large part of the fear, because the unknown is what the body reacts to. Second, learn a simple breathing routine, four counts in and six counts out, and use it in the two minutes before entering the hall. Third, replace the thought 'I must not fail' with 'I will do the first question, then the second', because the mind cannot hold a vague threat and a concrete task at the same time.\n\nIf anxiety persists for weeks, affects sleep, or appears without any examination in sight, the student should speak to a counsellor. Early help is far more effective than last-minute endurance.","ph":["a racing heart 心跳加速","practise under the conditions of the real examination 在真实考试条件下练习","the unknown is what the body reacts to 身体反应的是未知","in sight 在望、即将到来"]},{"id":"w079","tp":"建议措施","ti":"如何提高图书馆利用率","dir":"Directions: A university library is well equipped but underused. Write an essay suggesting how to make better use of it. You should write 120 to 180 words.","ol":["分析闲置原因","从空间、服务、推广三方面提建议","给出评估方式"],"fr":["第一段：说明「设备好但人少」的原因","第二段：三条建议（分区、嵌入课程、数据驱动采购）","第三段：如何衡量效果"],"es":"A library with new furniture and few readers is a common paradox. The cause is usually not the building but the mismatch between what it offers and how students actually work.\n\nThree changes would help. First, divide the space by function: a silent floor, a discussion floor and a floor where food and calls are allowed. Students avoid libraries when they cannot predict which rule applies where. Second, embed the library in teaching. When a course requires a session with a subject librarian, usage rises immediately and stays higher, because students learn what the databases contain. Third, let borrowing data shape purchases; buying more of what is actually requested is more effective than buying according to a list.\n\nSuccess should be measured by seats occupied at three in the afternoon, not by the number of volumes held. A library is working when it is difficult to find a chair.","ph":["a common paradox 常见的悖论","the mismatch between A and B A 与 B 之间的错配","embed the library in teaching 把图书馆嵌入教学","Seats occupied ... not by the number of volumes 以座位使用率而非藏书量衡量"]},{"id":"w080","tp":"建议措施","ti":"如何推动校园体育","dir":"Directions: Many university students do little exercise. Write an essay suggesting how to encourage them to take part in sports. You should write 120 to 180 words.","ol":["说明不运动的真实原因","提出降低门槛的三条措施","说明激励机制的设计"],"fr":["第一段：原因不是懒，而是门槛与时间","第二段：措施（短时段课程、同伴组队、场地预约透明）","第三段：激励如何避免形式化"],"es":"Most students who avoid sport are not lazy; they face three practical barriers: no time, no partner and no idea where to start.\n\nThe first barrier is best addressed with short sessions. A thirty-minute class at lunchtime attracts people who will never commit to a ninety-minute training. The second is social: team registration with a friend doubles attendance, because skipping means letting someone down. The third is information: a single page showing which courts are free tonight, updated hourly, removes the frustration of arriving at a full gym.\n\nIncentives need care. Requiring a fixed number of exercise sessions invites students to swipe a card and leave. It is better to reward participation in a league or a course that meets weekly, where attendance is visible and the activity has a social cost.\n\nThe goal is not to produce athletes but to make one hour of movement a normal part of the week.","ph":["face three practical barriers 面临三个实际障碍","commit to 承诺投入","letting someone down 让某人失望","invites students to swipe a card and leave 促使学生刷个卡就走"]},{"id":"w081","tp":"建议措施","ti":"如何减少宿舍矛盾","dir":"Directions: Conflicts in dormitories are common. Write an essay suggesting how to reduce them. You should write 120 to 180 words.","ol":["指出矛盾的真正来源","提出三条措施","说明冲突处理机制"],"fr":["第一段：矛盾多源于未说出口的默认规则","第二段：措施（入住时定规则、轮值、冷却机制）","第三段：第三方调解的作用"],"es":"Dormitory conflicts are rarely about the obvious issues. They start with rules that no one stated: whether the light goes off at eleven, whether a friend may stay overnight, who buys the cleaning supplies.\n\nThree measures reduce the friction. First, the first week should produce a short written agreement — five points are enough — because a rule agreed in advance is easier to invoke than a complaint invented in anger. Second, rotate responsibilities monthly, since the person who has taken out the rubbish for a term resents it more.\n\nSome conflicts need a third party. A resident adviser who is trained to mediate, rather than to judge, can convert a shouting match into a negotiation about specific behaviour.\n\nThe aim is not friendship but predictability. Most people can live with difference; almost no one can live with uncertainty.","ph":["rules that no one stated 没人明说过的规则","invoke 援引（规则）","rotate responsibilities 轮值","convert a shouting match into a negotiation 把吵架变成协商"]},{"id":"w082","tp":"建议措施","ti":"如何提高课堂参与度","dir":"Directions: Many students stay silent in class. Write an essay suggesting how to increase participation. You should write 120 to 180 words.","ol":["分析沉默的原因","从教师设计角度提三条建议","说明学生自身可做的改变"],"fr":["第一段：沉默不等于没想法","第二段：措施（先写后说、小组预热、点名可预期）","第三段：学生侧的准备"],"es":"Silence in class is usually not ignorance. Students report three reasons for not speaking: they need time to formulate a thought, they fear sounding foolish in front of a large group, and they do not know whether the point is welcome.\n\nA teacher can remove all three obstacles with small design changes. Asking students to write for two minutes before discussion gives the slow thinkers something to read from. Starting in pairs, then merging pairs into fours, lowers the cost of a first contribution. Announcing that the first five minutes belong to questions, and that no question will be judged, sets an expectation that makes speaking normal.\n\nStudents have their own work to do. Reading the assigned text and writing one question before class changes the experience entirely, because a person with a prepared question is no longer improvising.\n\nParticipation is a habit produced by design and preparation, not a personality trait distributed unevenly among students.","ph":["sound foolish 显得愚蠢","lower the cost of a first contribution 降低第一次发言的成本","no longer improvising 不再即兴发挥","distributed unevenly 分配不均"]},{"id":"w083","tp":"建议措施","ti":"如何应对信息过载","dir":"Directions: Students are overwhelmed by information. Write an essay suggesting how to manage it. You should write 120 to 180 words.","ol":["说明信息过载的实质","提出三条管理措施","强调输出导向"],"fr":["第一段：过载不是信息太多，而是筛选成本太高","第二段：措施（固定信息时段、来源白名单、笔记沉淀）","第三段：以输出为标准"],"es":"Information overload is usually described as having too much to read. In practice, the difficulty is different: the cost of deciding what to ignore has become higher than the cost of reading.\n\nThree measures help. First, confine intake to fixed periods — twenty minutes in the morning, twenty in the evening — rather than checking continuously, which fragments attention without adding knowledge. Second, keep a short list of trusted sources and read them thoroughly instead of sampling twenty accounts superficially. Third, write something after reading: three sentences summarising the argument are worth more than a saved bookmark that will never be opened.\n\nThe test of a reading habit is not how much has been consumed but what can be reproduced. A student who can explain one article a day to a friend is better informed than one who has skimmed forty.\n\nInformation becomes knowledge only when it is processed. Everything else is noise with a timestamp.","ph":["the cost of deciding what to ignore 决定忽略什么的成本","confine intake to fixed periods 把信息摄入限制在固定时段","sampling ... superficially 浅层浏览","noise with a timestamp 带时间戳的噪音"]},{"id":"w084","tp":"建议措施","ti":"如何鼓励毕业生到基层工作","dir":"Directions: Some regions lack skilled graduates. Write an essay suggesting how to encourage graduates to work there. You should write 120 to 180 words.","ol":["说明毕业生顾虑的核心","提出三条措施","强调长期发展而非一次性补贴"],"fr":["第一段：顾虑不是待遇单一因素","第二段：措施（职业通道、生活配套、服务期限弹性）","第三段：政策设计的关键"],"es":"Encouraging graduates to work in less developed regions fails when policy addresses only salary. The deeper concerns are career progression, daily life and the fear of being forgotten.\n\nThree measures are more effective than a one-off subsidy. First, create a visible promotion path: a young teacher or doctor sent to a county should know that excellent work leads to further training and a route back to a larger institution, not to permanent exile. Second, fix the practical basics — housing, childcare, internet and transport — because these determine whether a spouse will agree to come. Third, allow flexible service periods, such as two years with an option to extend, which lowers the perceived commitment and attracts those who would never sign for five.\n\nMoney helps, but it cannot compensate for a career that appears to end at arrival. The message should be that service in a difficult region is a stage with a future, not a detour from one.","ph":["a one-off subsidy 一次性补贴","permanent exile 永久流放","fix the practical basics 解决基本生活配套","a detour from one 绕离正路"]},{"id":"w085","tp":"建议措施","ti":"如何改善城市空气质量","dir":"Directions: Air pollution remains a problem in some cities. Write an essay suggesting how to improve air quality. You should write 120 to 180 words.","ol":["指出污染源的结构","提出三条措施","说明协同治理的必要"],"fr":["第一段：污染来源分散，单一措施无效","第二段：措施（能源、交通、区域联防）","第三段：长期监测与公众参与"],"es":"Air quality cannot be fixed by one measure, because the sources are distributed across several systems.\n\nThree interventions matter most. First, the energy structure: replacing coal-fired heating and small industrial boilers with gas or electricity removes a large share of winter particulate matter. Second, transport: converting buses and taxis to electric power, and charging congestion fees in the centre, reduces nitrogen oxides where people actually breathe. Third, regional coordination: pollution does not respect administrative boundaries, so a city that cleans its own streets while its neighbour expands steel capacity will not see the benefit.\n\nMonitoring should be public and continuous. When hourly data are available at street level, residents can adjust their behaviour and officials cannot claim improvement that the instruments deny.\n\nClean air is a long project with visible milestones. The measurable target should be the number of days below the standard, not the number of meetings held.","ph":["distributed across several systems 分布在多个系统中","does not respect administrative boundaries 不分行政边界","cannot claim improvement that the instruments deny 无法宣称仪器否认的改善","visible milestones 可见的里程碑"]},{"id":"w086","tp":"建议措施","ti":"如何保护地方方言","dir":"Directions: Local dialects are declining. Write an essay suggesting how to protect them. You should write 120 to 180 words.","ol":["说明方言消失的机制","提出三条措施","说明保护与推广普通话不冲突"],"fr":["第一段：消失源于代际传递中断","第二段：措施（家庭使用、学校社团、数字记录）","第三段：澄清与普通话的关系"],"es":"Dialects disappear not because people stop liking them but because the chain of transmission breaks. When parents speak Mandarin to children and grandparents are the only dialect speakers, a language loses its next generation within thirty years.\n\nFirst, families should keep one domain for the dialect — meals, calls to grandparents, festivals — so that children hear it in emotional contexts rather than as a performance. Second, schools can support dialect clubs and local opera performances as extracurricular activities, without adding to the examination burden. Third, universities and libraries should record elderly speakers systematically, including everyday conversation rather than only formal vocabulary, since it is the ordinary register that is vanishing fastest.\n\nProtecting a dialect does not compete with promoting standard Chinese. A person can write in one and joke in the other, and most of the world's multilingual speakers do exactly that. The loss would not be a loss of communication but of a way of seeing.","ph":["the chain of transmission breaks 传承链条断裂","keep one domain for 为……保留一个场景","the ordinary register 日常语域","compete with 与……冲突"]},{"id":"w087","tp":"建议措施","ti":"如何提高公交吸引力","dir":"Directions: Public transport is losing passengers to private cars. Write an essay suggesting how to attract more riders. You should write 120 to 180 words.","ol":["分析乘客流失的原因","提出三条改进措施","说明优先级"],"fr":["第一段：流失不是价格问题","第二段：措施（准点率、换乘体验、专用道）","第三段：为何可靠性优先"],"es":"Passengers rarely abandon buses because of the fare. They leave because the bus is unpredictable, the transfer is unpleasant, or the journey takes twice as long as driving.\n\nThree improvements follow directly. First, reliability: a bus that arrives every eight minutes does not require a timetable, and passengers stop checking apps. This depends on dedicated lanes, which are politically difficult but decisive. Second, transfers: a single ticket valid for ninety minutes across buses and the subway removes the penalty for changing vehicles. Third, information and shelter: real-time arrival displays and a roof at every stop cost little and change how the wait feels.\n\nPriority matters. Reliability comes first, because a comfortable bus that arrives late is still useless. Frequency comes second, because waiting is the largest part of the perceived journey. Comfort comes third.\n\nA city that makes the bus dependable does not need to persuade drivers to give up their cars; the arithmetic does it.","ph":["abandon buses 放弃公交","dedicated lanes 公交专用道","removes the penalty for changing vehicles 取消换乘的额外成本","the perceived journey 感知到的行程时间"]},{"id":"w088","tp":"建议措施","ti":"如何帮助新生适应大学","dir":"Directions: Many freshmen find it hard to adapt to university life. Write an essay suggesting how to help them. You should write 120 to 180 words.","ol":["指出适应困难的三个方面","提出对应措施","说明谁应负责"],"fr":["第一段：困难（学习方法、社交、生活自理）","第二段：措施（学业导师、朋辈辅导、生活课程）","第三段：责任分工"],"es":"Freshmen struggle with three things at once: a method of study that no longer works, a social world that must be rebuilt, and daily life that must be managed without parents.\n\nThe first difficulty is often invisible to the student. Someone who succeeded at school by memorising may fail at university, not from laziness but from using the wrong method; a short course on note-taking in the first month prevents a term of quiet failure. The second is social, and the third is daily life.\n\nResponsibility should be shared rather than delegated. The university provides structure, the department provides mentors, and senior students provide the informal knowledge that makes an institution navigable.\n\nAdaptation is not a personality test that some students fail. It is a skill that can be taught before it is needed.","ph":["a social world that must be rebuilt 必须重建的社交世界","prevents a term of quiet failure 避免一整学期的无声失败","the questions that no one dares to ask 没人敢问的问题","navigable 可被摸清的"]},{"id":"w089","tp":"建议措施","ti":"如何减少一次性塑料","dir":"Directions: Single-use plastics cause serious pollution. Write an essay suggesting how to reduce their use on campus. You should write 120 to 180 words.","ol":["说明一次性塑料的使用场景","提出替代与制度两类措施","说明行为改变的条件"],"fr":["第一段：用量集中在几个场景","第二段：替代方案 + 制度设计（押金、自带优惠）","第三段：便利性是关键"],"es":"On a campus, single-use plastic appears in a few predictable places: takeaway containers, drink cups, bags and delivery packaging. Because the sources are concentrated, they can be attacked directly.\n\nSubstitution is the first step. Canteens can offer a reusable box with a small deposit, refunded on return; the deposit must be high enough to matter and low enough not to deter. Cafes can give a one-yuan discount to anyone who brings a cup.\n\nConvenience decides whether these measures survive. A reuse scheme that requires washing the box at home will fail in a dormitory without a kitchen; one with a washing station beside the collection point will work.\n\nReduction is not about heroism. It is about making the reusable option the easier one.","ph":["can be attacked directly 可以被直接针对","high enough to matter and low enough not to deter 高到有约束力，低到不吓退人","by default rather than by request 默认而非按需","making the reusable option the easier one 让可重复使用成为更省事的选择"]},{"id":"w090","tp":"建议措施","ti":"如何完善社区养老","dir":"Directions: China's population is ageing quickly. Write an essay suggesting how to improve community care for the elderly. You should write 120 to 180 words.","ol":["说明社区养老的定位","提出三条措施","说明人力问题的解决"],"fr":["第一段：社区养老介于家庭与机构之间","第二段：措施（助餐、日间照料、上门医疗）","第三段：人力与支付"],"es":"Community care sits between the family and the institution, and it is the only model that can serve most older people at a cost the country can afford.\n\nThree services matter most. The first is a meal service: a canteen that delivers lunch to those over eighty costs less than institutional care and removes the most common daily risk, a skipped meal. The second is day care, which gives family carers a few hours of relief.\n\nCare work is poorly paid and rarely seen as a career. Training programmes, recognised certificates and a clear promotion path would help, and so would allowing younger volunteers to earn course credit.\n\nCommunity care succeeds when it is close, cheap and reliable. Everything else is detail.","ph":["sits between A and B 处于 A 与 B 之间","at a cost the country can afford 以国家负担得起的成本","gives family carers a few hours of relief 让家庭照护者喘口气","Everything else is detail 其余都是细节"]}]};

  function hostOf(url) {
    var m = String(url || '').replace(/^https?:\/\//i, '').match(/^([^\/?#]+)/);
    return (m ? m[1] : '').toLowerCase().split(':')[0];
  }
  function platformOf(url) {
    var h = hostOf(url);
    for (var i = 0; i < PLATFORMS.length; i++) {
      if (PLATFORMS[i].re.test(h)) return PLATFORMS[i];
    }
    return { name: h.length > 18 ? h.slice(0, 17) + '…' : h || '网页', ph: h.length > 18 ? h.slice(0, 17) + '…' : (h || '网页') };
  }

  function stripEmoji(s) {
    try {
      return s.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{2190}-\u{21FF}\u{2700}-\u{27BF}]/gu, ' ');
    } catch (e) {
      return s.replace(/[\u2600-\u27BF]/g, ' ');
    }
  }

  function stripWrapping(s) {
    var pairs = [['【', '】'], ['[', ']'], ['「', '」'], ['『', '』'], ['（', '）'], ['(', ')'], ['《', '》'], ['<', '>']];
    var changed = true;
    while (changed) {
      changed = false;
      s = s.trim();
      for (var i = 0; i < pairs.length; i++) {
        var a = pairs[i][0], b = pairs[i][1];
        if (s.length > a.length + b.length && s.indexOf(a) === 0 && s.lastIndexOf(b) === s.length - b.length) {
          s = s.slice(a.length, s.length - b.length);
          changed = true;
        }
      }
    }
    return s.trim();
  }

  function looksLikeJunkTitle(t) {
    if (!t) return true;
    var core = t.replace(/\s+/g, '');
    if (!core) return true;
    if (/^[a-z0-9.:\-_\/]+$/i.test(core) && /\./.test(core)) return true;         // 纯域名
    if (/^BV[0-9A-Za-z]{10}$/.test(core)) return true;                              // BV 号
    if (/^[A-Za-z0-9]{10,24}$/.test(core) && /\d/.test(core) && !/[\u4e00-\u9fa5]/.test(core)) return true; // 短码
    return false;
  }

  function titleFromUrl(url) {
    var path = String(url).split(/[?#]/)[0].replace(/^https?:\/\/[^\/]+/i, '');
    var seg = path.split('/').filter(Boolean).pop() || '';
    seg = seg.replace(/\.(html?|php|aspx?|jsp)$/i, '').replace(/[-_]+/g, ' ').trim();
    var junk = !seg || seg.length <= 1 || /^\d+$/.test(seg) ||
      /^BV[0-9A-Za-z]{10}$/.test(seg) ||                    // BV 号
      /^[A-Za-z0-9]{16,}$/.test(seg) ||                      // 长短码
      (/^[A-Za-z0-9]{4,14}$/.test(seg) && /\d/.test(seg));  // 含数字的短码
    if (!junk) return truncate(seg, 80);
    return platformOf(url).ph;
  }

  function cleanTitle(raw, url) {
    var s = String(raw || '').trim();
    if (!s) return '';

    // 1. 剥分享尾巴
    s = s.replace(/[，,]\s*(复制|打开|下载)[\s\S]*$/, '');
    s = s.replace(/[，,]\s*[^，,]{0,12}(App|APP|app)[\s\S]*$/, '');
    // 2. 剥行首短码：59 / 7.43 / pMx:/
    s = s.replace(/^\s*\d{1,2}(?:\.\d{1,3})?\s+/, '');
    s = s.replace(/^\s*[A-Za-z0-9]{2,6}:\/{1,2}\s*/, '');
    // 3. 剥引导语与作者前缀
    s = s.replace(/^复制打开(抖音|快手|小红书|B站|bilibili)[，,]?\s*(看看)?\s*/, '');
    s = s.replace(/^【[^】]{1,24}的作品】\s*/, '');
    // 4. 剥 emoji 与话题标签
    s = stripEmoji(s);
    s = s.replace(/#[^#\s]{1,24}#/g, ' ');
    // 5. 循环剥外层包裹
    s = stripWrapping(s);
    // 6. 剥来源尾巴
    s = s.replace(/\s*[-_—]\s*(哔哩哔哩|bilibili|小红书|抖音|YouTube|youtube)\s*$/i, '');
    s = s.replace(/_bilibili\s*$/i, '');
    // 7. 剥残留首尾符号
    s = s.replace(/^[\s|\-_,，、·.]+/, '').replace(/[\s|\-_,，、·.]+$/, '');
    s = s.replace(/\s{2,}/g, ' ').trim();

    if (looksLikeJunkTitle(s)) return '';
    return truncate(s, 160);
  }

  function extractUrl(text) {
    var m = URL_RE.exec(text);
    if (m) {
      var u = m[0].replace(/[.,;:!?)\]}"'”’]+$/, '');
      return { url: u, start: m.index, end: m.index + u.length, bare: false };
    }
    var b = BARE_RE.exec(text);
    if (b) {
      var raw = b[2].replace(/[.,;:!?)\]}"'”’]+$/, '');
      var start = b.index + b[1].length;
      return { url: 'https://' + raw.replace(/^\/\//, ''), start: start, end: start + raw.length, bare: true };
    }
    return null;
  }

  function normalizeUrl(u) {
    return String(u || '').trim().replace(/\/+$/, '');
  }

  function parseJsonItems(raw) {
    var out = [];
    var data;
    try { data = JSON.parse(raw); } catch (e) { return out; }
    var list = null;
    if (Array.isArray(data)) list = data;
    else if (data && typeof data === 'object') {
      var keys = ['items', 'list', 'data', 'result'];
      for (var i = 0; i < keys.length; i++) {
        if (Array.isArray(data[keys[i]])) { list = data[keys[i]]; break; }
      }
      if (!list && Array.isArray(data.entries)) list = data.entries;
      if (!list) list = [data];
    }
    if (!list) return out;
    list.forEach(function (it) {
      if (typeof it === 'string') {
        var ex = extractUrl(it);
        if (ex) out.push({ title: cleanTitle(it.slice(0, ex.start), ex.url) || titleFromUrl(ex.url), url: ex.url });
        return;
      }
      if (!it || typeof it !== 'object') return;
      var url = it.url || it.link || it.href || it.URL || it.Link || '';
      var title = it.title || it.name || it.text || it.desc || it.description || '';
      if (!url) {
        var found = extractUrl(String(title));
        if (found) { url = found.url; title = String(title).slice(0, found.start); }
      }
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + String(url).replace(/^\/\//, '');
      out.push({ title: cleanTitle(title, url) || titleFromUrl(url), url: url });
    });
    return out;
  }

  function parseRssItems(raw) {
    var out = [];
    if (typeof DOMParser === 'undefined') return out;
    var doc;
    try { doc = new DOMParser().parseFromString(raw, 'application/xml'); } catch (e) { return out; }
    if (!doc || doc.getElementsByTagName('parsererror').length) return out;

    function txt(node, names) {
      for (var i = 0; i < names.length; i++) {
        var el = node.getElementsByTagName(names[i])[0];
        if (el && (el.textContent || '').trim()) return el.textContent.trim();
      }
      return '';
    }
    var nodes = doc.getElementsByTagName('item');
    if (!nodes.length) nodes = doc.getElementsByTagName('entry');
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var title = txt(n, ['title']);
      var linkEl = n.getElementsByTagName('link')[0];
      var url = linkEl ? (linkEl.getAttribute('href') || linkEl.textContent.trim()) : txt(n, ['guid', 'id']);
      if (!url) continue;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + String(url).replace(/^\/\//, '');
      out.push({ title: cleanTitle(title, url) || titleFromUrl(url), url: url });
    }
    return out;
  }

  function parseImport(text) {
    var raw = String(text == null ? '' : text).trim();
    if (!raw) return [];
    var items = [];

    if (/^[\[{]/.test(raw)) items = parseJsonItems(raw);

    if (!items.length && /<(rss|feed|item|entry)[\s>]/i.test(raw)) items = parseRssItems(raw);

    if (!items.length) {
      var lines = raw.split(/\r?\n/);
      var prevText = '';
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var t = line.trim();
        if (!t || t.charAt(0) === '#') continue;
        var ex = extractUrl(t);
        if (!ex) { prevText = t; continue; }

        var head = t.slice(0, ex.start).trim();
        var tail = t.slice(ex.end).trim();
        var titleRaw = head;
        if (!titleRaw) {
          // 整行只有链接：向上取上一行当标题
          titleRaw = prevText;
        } else if (!cleanTitle(titleRaw, ex.url) && tail && !extractUrl(tail)) {
          titleRaw = tail;
        }
        var title = cleanTitle(titleRaw, ex.url);
        items.push({ title: title || titleFromUrl(ex.url), url: ex.url });
        prevText = '';
      }
    }

    // 去重 + 截断
    var seen = {}, out = [];
    items.forEach(function (it) {
      if (!it || !it.url) return;
      it.url = String(it.url).trim();
      if (!/^https?:\/\//i.test(it.url)) return;
      var key = normalizeUrl(it.url).toLowerCase();
      if (seen[key]) return;
      seen[key] = 1;
      it.title = truncate(String(it.title || '').trim() || titleFromUrl(it.url), 160);
      out.push(it);
    });
    return out;
  }

  function allCustom(part) {
    var kind = part.indexOf('read') === 0 ? 'read' : part === 'listen' ? 'listen' : part.indexOf('trans') === 0 ? 'trans' : 'write';
    var all = customItems(kind);
    if (part === 'read-easy' || part === 'trans-easy') return all.filter(function (x) { return x.level !== 'hard'; });
    if (part === 'read-hard' || part === 'trans-hard') return all.filter(function (x) { return x.level === 'hard'; });
    return all;
  }

  function poolSig(part) {
    var p = poolFor(part);
    var ids = p.map(function (x) { return x.id; }).sort().join(',');
    return p.length + '#' + hash32(ids).toString(36);
  }

  function seenKey(part) {
    return part.indexOf('read') === 0 ? 'read' : part === 'listen' ? 'listen' : part.indexOf('trans') === 0 ? 'trans' : 'write';
  }

  function restFor(part, poolLen) {
    if (part.indexOf('read') === 0) return Math.max(1, poolLen);            // 阅读：整档轮完才回头
    if (part === 'listen') return Math.max(6, Math.round(poolLen * 0.66));  // 听力：max(6, 池长×0.66)
    if (part.indexOf('trans') === 0) return Math.max(1, poolLen * 2);       // 翻译：档位池长 × 2
    return Math.max(1, poolLen);                                            // 写作：整池轮完
  }

  function target_n(part) {
    if (part === 'listen') return 2;
    return 1;
  }

  function drawPool(part, today) {
    var pool = poolFor(part);
    var key = seenKey(part);
    var seen = State.seen[key] || {};
    var rest = restFor(part, pool.length);
    var seed = hash32(today + '|' + part + '|' + State.poolV + '|' + poolSig(part));
    var idx = dayIndex(today);

    var eligible = pool.filter(function (x) {
      var last = seen[x.id];
      return last === undefined || (idx - last) >= rest;
    });
    var picked = shuffle(eligible, seed).slice(0, target_n(part));

    // 补位：不够时按「最久没出现」补满
    if (picked.length < target_n(part)) {
      var chosen = {};
      picked.forEach(function (x) { chosen[x.id] = 1; });
      var restPool = pool.filter(function (x) { return !chosen[x.id]; })
        .map(function (x, i) { return { x: x, last: seen[x.id] === undefined ? -1e9 : seen[x.id], i: i }; })
        .sort(function (a, b) { return a.last - b.last || a.i - b.i; });
      for (var i = 0; i < restPool.length && picked.length < target_n(part); i++) {
        picked.push(restPool[i].x);
      }
    }
    return picked;
  }

  function drawListen(today) {
    var pool = poolFor('listen');
    var seen = State.seen.listen || {};
    var rest = restFor('listen', pool.length);
    var seed = hash32(today + '|listen|' + State.poolV + '|' + poolSig('listen'));
    var idx = dayIndex(today);

    var eligible = pool.filter(function (x) {
      var last = seen[x.id];
      return last === undefined || (idx - last) >= rest;
    });
    var ordered = shuffle(eligible, seed);

    // 补位
    if (!ordered.length) {
      ordered = pool.slice().map(function (x, i) { return { x: x, last: seen[x.id] === undefined ? -1e9 : seen[x.id], i: i }; })
        .sort(function (a, b) { return a.last - b.last || a.i - b.i; })
        .map(function (o) { return o.x; });
    }

    var capped = ordered.filter(function (x) { return x.min <= 30; });
    var seq = capped.length ? capped : ordered;   // 单条就超 30 分钟时才退让

    var picked = [];
    var sum = 0;
    for (var i = 0; i < seq.length && picked.length < 2; i++) {
      var it = seq[i];
      if (picked.length === 0) {
        if (it.min > 30) continue;
        picked.push(it); sum += it.min; continue;
      }
      if (sum + it.min <= 30 && sum < 20) { picked.push(it); sum += it.min; }
    }

    if (!picked.length && seq.length) picked = [seq[0]];   // 极端兜底，绝不空手

    // 只凑出一条且不足 15 分钟 → 换一条 18–30 分钟的单条
    if (picked.length === 1 && picked[0].min < 15) {
      var longOne = pool.filter(function (x) { return x.min >= 18 && x.min <= 30; })
        .map(function (x, i) { return { x: x, last: seen[x.id] === undefined ? -1e9 : seen[x.id], i: i }; })
        .sort(function (a, b) { return a.last - b.last || a.i - b.i; })[0];
      if (longOne) picked = [longOne.x];
    }
    return picked;
  }

  function forceCustom(part, list) {
    var cust = allCustom(part);
    if (!cust.length) return list;
    var hasCustom = list.some(function (x) { return x.custom; });
    if (hasCustom) return list;
    // 优先挑最久没出现的自建条目
    var key = seenKey(part);
    var seen = State.seen[key] || {};
    cust.sort(function (a, b) {
      var la = seen[a.id] === undefined ? -1e9 : seen[a.id];
      var lb = seen[b.id] === undefined ? -1e9 : seen[b.id];
      return la - lb;
    });
    var pick = cust[0];
    if (part === 'listen') {
      var out = [pick].concat(list);
      return out.slice(0, 2);
    }
    return [pick];
  }

  function pushFor(date) {
    var p = State.push[date];
    if (!p || p.v !== SCHEMA) return null;
    return p;
  }

  function buildPush(date) {
    var res = {};
    res.re = forceCustom('read-easy', drawPool('read-easy', date)).map(function (x) { return x.id; });
    res.rh = forceCustom('read-hard', drawPool('read-hard', date)).map(function (x) { return x.id; });
    res.l = forceCustom('listen', drawListen(date)).map(function (x) { return x.id; });
    var tpart = dayIndex(date) % 2 === 0 ? 'trans-easy' : 'trans-hard';
    res.t = forceCustom(tpart, drawPool(tpart, date)).map(function (x) { return x.id; });
    res.tl = tpart === 'trans-easy' ? 'easy' : 'hard';
    res.w = forceCustom('write', drawPool('write', date)).map(function (x) { return x.id; });
    res.sig = {
      re: poolSig('read-easy'), rh: poolSig('read-hard'),
      l: poolSig('listen'), t: poolSig(tpart), w: poolSig('write')
    };
    res.poolV = State.poolV;
    res.v = SCHEMA;
    res.date = date;
    return res;
  }

  function getPush(date) {
    var p = pushFor(date);
    var tpart = dayIndex(date) % 2 === 0 ? 'trans-easy' : 'trans-hard';
    var need = { re: poolSig('read-easy'), rh: poolSig('read-hard'), l: poolSig('listen'), t: poolSig(tpart), w: poolSig('write') };
    var valid = p && p.sig && ['re', 'rh', 'l', 't', 'w'].every(function (k) { return p.sig[k] === need[k]; });
    if (!valid) {
      p = buildPush(date);
      State.push[date] = p;
      markSeen(date, p);
      prunePush();
      save();
    }
    return p;
  }

  function findItem(part, id) {
    var pool = poolFor(part);
    for (var i = 0; i < pool.length; i++) if (pool[i].id === id) return pool[i];
    return null;
  }

  function pushItems(date) {
    var p = getPush(date);
    var out = { read: [], listen: [], trans: [], write: [], transLevel: p.tl };
    p.re.forEach(function (id) { var x = findItem('read-easy', id); if (x) out.read.push(x); });
    p.rh.forEach(function (id) { var x = findItem('read-hard', id); if (x) out.read.push(x); });
    p.l.forEach(function (id) { var x = findItem('listen', id); if (x) out.listen.push(x); });
    p.t.forEach(function (id) { var x = findItem('trans-' + p.tl, id); if (x) out.trans.push(x); });
    p.w.forEach(function (id) { var x = findItem('write', id); if (x) out.write.push(x); });
    return out;
  }

  function markSeen(date, p) {
    var idx = dayIndex(date);
    var map = { read: p.re.concat(p.rh), listen: p.l, trans: p.t, write: p.w };
    Object.keys(map).forEach(function (k) {
      var store = State.seen[k] || (State.seen[k] = {});
      var order = State.seenOrder[k] || (State.seenOrder[k] = []);
      map[k].forEach(function (id) {
        store[id] = idx;
        var at = order.indexOf(id);
        if (at >= 0) order.splice(at, 1);
        order.push(id);
      });
      while (order.length > MAX_SEEN) {
        var old = order.shift();
        delete store[old];
      }
    });
  }

  function prunePush() {
    var dates = Object.keys(State.push).sort();
    while (dates.length > MAX_PUSH) delete State.push[dates.shift()];
  }

  /* =========================================================
     打卡与统计
     ========================================================= */
  function getDay(date) { return State.days[date] || null; }
  function ensureDay(date) {
    if (!State.days[date]) State.days[date] = { w: 0, r: 0, l: 0, t: 0, p: 0, carry: true };
    return State.days[date];
  }

  function baseTargets() {
    var g = State.goals;
    return { w: Math.max(1, g.word), r: Math.max(1, g.read), l: Math.max(1, g.listen), t: Math.max(1, g.trans), p: Math.max(1, g.write) };
  }

  // 逾期只顺延一天：昨天的缺口并入今天；可手动关掉
  function targetsFor(date) {
    var base = baseTargets();
    var d = getDay(date);
    if (d && d.carry === false) return base;
    var prev = shift(date, -1);
    var pd = getDay(prev);
    if (!pd) return base;
    var out = {};
    ['w', 'r', 'l', 't', 'p'].forEach(function (k) {
      var gap = Math.max(0, base[k] - (pd[k] || 0));
      out[k] = base[k] + gap;
    });
    return out;
  }

  function carryGaps(date) {
    var base = baseTargets();
    var d = getDay(date);
    if (d && d.carry === false) return null;
    var pd = getDay(shift(date, -1));
    if (!pd) return null;
    var g = {}, any = 0;
    ['w', 'r', 'l', 't', 'p'].forEach(function (k) {
      var gap = Math.max(0, base[k] - (pd[k] || 0));
      g[k] = gap;
      any += gap;
    });
    return any > 0 ? g : null;
  }

  function statsFor(date) {
    var d = getDay(date) || { w: 0, r: 0, l: 0, t: 0, p: 0 };
    var tg = targetsFor(date);
    var items = SUBJECTS.map(function (s) {
      var done = Math.max(0, +d[s.k] || 0);
      var target = tg[s.k];
      return {
        k: s.k, name: s.name, color: s.color, unit: s.unit,
        done: done, target: target, ok: done >= target,
        gap: Math.max(0, target - done),
        pct: Math.min(1, done / Math.max(1, target))
      };
    });
    var okCount = items.filter(function (i) { return i.ok; }).length;
    return { items: items, okCount: okCount, complete: okCount === 5, targets: tg, raw: d };
  }

  function addCount(date, key, n) {
    var d = ensureDay(date);
    d[key] = Math.max(0, (+d[key] || 0) + n);
    save();
    return d[key];
  }
  function setCount(date, key, v) {
    var d = ensureDay(date);
    d[key] = Math.max(0, +v || 0);
    save();
  }
  function setAllDone(date) {
    var st = statsFor(date);
    var d = ensureDay(date);
    st.items.forEach(function (i) { d[i.k] = Math.max(d[i.k] || 0, i.target); });
    save();
  }

  function streak(today) {
    var n = 0, cur = today;
    if (!statsFor(today).complete) cur = shift(today, -1);
    while (statsFor(cur).complete) { n++; cur = shift(cur, -1); }
    return n;
  }

  function totalFive() {
    var sum = 0;
    Object.keys(State.days).forEach(function (d) {
      var o = State.days[d];
      sum += (o.w || 0) + (o.r || 0) + (o.l || 0) + (o.t || 0) + (o.p || 0);
    });
    return sum;
  }

  function weekRate(today) {
    var done = 0;
    for (var i = 0; i < 7; i++) if (statsFor(shift(today, -i)).complete) done++;
    return done / 7;
  }

  function firstRecordDate() {
    var ds = Object.keys(State.days).sort();
    return ds.length ? ds[0] : State.created;
  }

  function rangeStat(days, today) {
    var start = shift(today, -(days - 1));
    var sum = { w: 0, r: 0, l: 0, t: 0, p: 0 }, meet = { w: 0, r: 0, l: 0, t: 0, p: 0 }, complete = 0;
    for (var i = 0; i < days; i++) {
      var date = shift(start, i);
      var st = statsFor(date);
      st.items.forEach(function (it) {
        sum[it.k] += it.done;
        if (it.ok) meet[it.k]++;
      });
      if (st.complete) complete++;
    }
    return { days: days, start: start, sum: sum, meet: meet, complete: complete };
  }

  function subjectRates() {
    var start = firstRecordDate(), today = todayStr();
    var total = Math.max(1, daysBetween(start, today) + 1);
    var meet = { w: 0, r: 0, l: 0, t: 0, p: 0 };
    var cur = start;
    while (dayIndex(cur) <= dayIndex(today)) {
      var st = statsFor(cur);
      st.items.forEach(function (it) { if (it.ok) meet[it.k]++; });
      cur = shift(cur, 1);
    }
    return SUBJECTS.map(function (s) {
      return { k: s.k, name: s.name, color: s.color, rate: meet[s.k] / total, meet: meet[s.k], days: total };
    });
  }

  function examDaysLeft() {
    return daysBetween(todayStr(), State.examDate);
  }

  /* ---------------- 对外导出 ---------------- */
  global.Core = {
    DB: DB, SCHEMA: SCHEMA, KEY: KEY, MAX_SEEN: MAX_SEEN, MAX_SOURCE_ITEMS: MAX_SOURCE_ITEMS,
    SUBJECTS: SUBJECTS, SUBJ: SUBJ, WORD_OPTIONS: WORD_OPTIONS, LIB_META: LIB_META, LIB_ORDER: LIB_ORDER,
    ICONS: ICONS, COLORS: COLORS,
    esc: esc, truncate: truncate, ymd: ymd, todayStr: todayStr, parseYmd: parseYmd, dayIndex: dayIndex,
    shift: shift, dateCN: dateCN, weekdayCN: weekdayCN, daysBetween: daysBetween,
    hash32: hash32, mulberry32: mulberry32, shuffle: shuffle,
    parseImport: parseImport, cleanTitle: cleanTitle, extractUrl: extractUrl, platformOf: platformOf,
    titleFromUrl: titleFromUrl, hostOf: hostOf,
    load: load, save: save, onSave: onSave, migrate: migrate,
    clearSamples: clearSamples, seedSamples: seedSamples,
    state: function () { return State; },
    libCount: libCount, libList: libList, wordBatch: wordBatch, suffixHint: suffixHint, speak: speak,
    poolFor: poolFor, getPush: getPush, pushItems: pushItems, findItem: findItem, customItems: customItems,
    resetPush: function (date) {
      delete State.push[date];
      var p = buildPush(date);
      State.push[date] = p;
      markSeen(date, p);
      save(true);
      return p;
    },
    invalidatePush: function () {
      State.poolV = (State.poolV || 1) + 1;
      State.push = {};
      save(true);
    },
    statsFor: statsFor, targetsFor: targetsFor, carryGaps: carryGaps, addCount: addCount, setCount: setCount,
    setAllDone: setAllDone, getDay: getDay, ensureDay: ensureDay, baseTargets: baseTargets,
    streak: streak, totalFive: totalFive, weekRate: weekRate, rangeStat: rangeStat,
    subjectRates: subjectRates, examDaysLeft: examDaysLeft, firstRecordDate: firstRecordDate
  };
})(window);

  function greeting() {

    if (h < 14) return '中午好';
    if (h < 18) return '下午好';

      if (hm >= (state().settings.at || '20:30')) {

  function carryBar(carry) {

      ? ('第 <b>' + b.from + '</b>–<b>' + b.to + '</b> 词' + (b.wraps ? '（到末尾回开头）' : ''))

  function markOf(word) {

  function cardBlock(b) {
    if (UI.wordIdx >= b.words.length) UI.wordIdx = 0;

    var mk = markOf(word);

    var h = '<div class="wcard ' + (UI.flipped ? '' : 'hidden-def') + '" data-act="flip">' +
      '<div class="flip-tip">' + (UI.flipped ? '点击收起释义' : '点击卡片翻面') + '</div>' +
      '<div class="w">' + esc(word) +
      '<button class="speak" data-act="speak" data-w="' + esc(word) + '" title="朗读">' + I.volume + '</button>' +
      (mk ? '<span class="pos" style="background:#F6F1F3;color:var(--ink-3)">' +
        (mk === 'known' ? '已认识' : mk === 'fuzzy' ? '模糊' : '不熟') + '</span>' : '') +
      '</div>' +
      '<div class="phon">' + (phon ? '/' + esc(phon) + '/' : '音标缺失') + '</div>' +
      (pos ? '<div style="margin-top:8px"><span class="pos">' + esc(pos) + '</span></div>' : '') +
      '<div class="defs">' + defs.map(function (d) { return '<span>' + esc(d) + '</span>'; }).join('') + '</div>' +
      (hint ? '<div class="suffix">词缀提示：' + esc(hint) + '</div>' : '') +
      '</div>';

    h += '<div class="wcard-foot">' +
      '<button class="btn ghost mini" data-act="wprev">上一词</button>' +
      '<span class="small muted">' + (UI.wordIdx + 1) + ' / ' + b.words.length + '</span>' +
      '<button class="btn ghost mini" data-act="wnext">下一词</button>' +
      '<span class="small muted" style="margin-left:auto">' + (UI.flipped ? '按自评记录，模糊/不熟自动进生词本' : '先自己在心里释义，再翻面') + '</span>' +
      '</div>';

    h += '<div class="rate-row">' +
      '<button class="rate-btn k" data-act="rate" data-s="known">' + I.check + '认识</button>' +
      '<button class="rate-btn f" data-act="rate" data-s="fuzzy">' + I.info + '模糊</button>' +
      '<button class="rate-btn u" data-act="rate" data-s="unknown">' + I.close + '不熟</button>' +
      '</div>';
    return h;
  }

  function quizBlock(b) {
    if (!UI.quiz || UI.quiz.idx >= b.words.length) {
      UI.quiz = buildQuiz(b, UI.wordIdx);
    }
    var q = UI.quiz;
    if (!q) return '<div class="small muted">这个词库暂时出不了题。</div>';
    var w = q.word;
    var h = '<div class="quiz"><div class="qword">' + esc(w[0]) +
      ' <button class="speak" data-act="speak" data-w="' + esc(w[0]) + '">' + I.volume + '</button></div>' +
      '<div class="phon small muted">' + (w[1] ? '/' + esc(w[1]) + '/' : '') + (w[2] ? ' · ' + esc(w[2]) : '') + '</div>';
    q.options.forEach(function (opt, i) {
      var cls = '';
      if (q.answered !== null) {
        if (i === q.answer) cls = 'right';
        else if (i === q.answered) cls = 'wrong';
      }
      h += '<button class="opt ' + cls + '" data-act="quiz" data-i="' + i + '"><b>' + 'ABCD'[i] + '</b><span>' + esc(opt) + '</span></button>';
    });
    if (q.answered !== null) {
      h += '<div class="small" style="margin-top:4px;color:' + (q.correct ? '#2F7A50' : 'var(--pink-dark)') + '">' +
        (q.correct ? '答对了，记一个。' : '答错，已加入生词本。正确答案：' + esc(q.options[q.answer])) + '</div>' +
        '<div><button class="btn mini" data-act="quiz-next">下一个</button></div>';
    }
    h += '</div>';
    return h;
  }

  function buildQuiz(b, startIdx) {
    var st = state();
    var list = b.words;
    if (!list.length) return null;
    var idx = startIdx % list.length;
    var w = list[idx];
    var correct = (w[3] && w[3][0]) || '（无释义）';
    var pool = C.libList(st.word.lib);
    var opts = [correct];
    var seed = C.hash32(w[0] + '|' + idx);
    var shuffled = C.shuffle(pool, seed);
    for (var i = 0; i < shuffled.length && opts.length < 4; i++) {
      var cand = C.DB.vocab.words[shuffled[i]];
      if (!cand) continue;
      var d = (cand[3] && cand[3][0]) || '';
      if (d && opts.indexOf(d) < 0) opts.push(d);
    }
    while (opts.length < 4) opts.push('（选项不足）');
    var order = C.shuffle(opts, seed + 7);
    return { word: w, options: order, answer: order.indexOf(correct), answered: null, correct: false, idx: idx };
  }

  function listBlock(b) {
    var h = '<div class="wlist">';
    b.words.forEach(function (w) {
      var mk = markOf(w[0]);
      h += '<div class="row"><i class="' + (mk ? mk.charAt(0) : '') + '"></i>' +

        '<span class="small muted" style="margin-left:auto;overflow:hidden;text-overflow:ellipsis">' + esc((w[3] || [])[0] || '') + '</span></div>';

  }

  function pushGrid(today) {

      '<h4>阅读 · 2 篇</h4><span class="cnt">易 1 + 难 1</span></header><div class="body">';
    if (!p.read.length) html += emptyHint('阅读池为空');
    p.read.forEach(function (it, i) {
      html += readItem(it, i, day.r > i, 'r');
    });
    html += '</div></div>';

    // 听力
    html += '<div class="push-col"><header><span class="bar" style="background:#6E5AA8"></span>' +
      '<h4>听力 · 1–2 个</h4><span class="cnt">累计 ≤30 分钟</span></header><div class="body">';
    if (!p.listen.length) html += emptyHint('听力池为空');
    p.listen.forEach(function (it, i) {

    html += '</div></div>';

    // 翻译
    html += '<div class="push-col"><header><span class="bar" style="background:#D9822B"></span>' +
      '<h4>翻译 · 1 段</h4><span class="cnt">' + (p.transLevel === 'easy' ? '今天排易档' : '今天排难档') + '</span></header><div class="body">';
    if (!p.trans.length) html += emptyHint('翻译池为空');
    p.trans.forEach(function (it, i) { html += transItem(it, i, day.t > i, 't'); });
    html += '</div></div>';

    // 写作
    html += '<div class="push-col"><header><span class="bar" style="background:#E0629B"></span>' +
      '<h4>写作 · 1 题</h4><span class="cnt">' + p.write.length + ' 题</span></header><div class="body">';
    if (!p.write.length) html += emptyHint('写作池为空');
    p.write.forEach(function (it, i) { html += writeItem(it, i, day.p > i, 'p'); });
    html += '</div></div>';

    html += '</div>';
    return html;
  }

  function statCard(icon, label, v, unit, extra) {
    return '<div class="stat"><div class="lb">' + icon + label + '</div>' +

  function heatmap(today) {
    var weeks = 26;
    var end = C.parseYmd(today);
    var dow = (end.getDay() + 6) % 7;                 // 周一=0
    var endMonday = C.shift(today, -dow);
    var start = C.shift(endMonday, -(weeks - 1) * 7);
    var cell = 13, gap = 3, w = weeks * (cell + gap), hgt = 7 * (cell + gap);
    var svg = '<svg class="heat" viewBox="0 0 ' + (w + 2) + ' ' + (hgt + 2) + '" width="100%" style="max-width:' + (w + 2) + 'px">';
    var months = [];
    for (var wk = 0; wk < weeks; wk++) {
      for (var d = 0; d < 7; d++) {
        var date = C.shift(start, wk * 7 + d);
        if (C.dayIndex(date) > C.dayIndex(today)) continue;
        var s = C.statsFor(date);
        var n = s.okCount;
        var fill = n === 0 ? '#F7EBF1' : C.COLORS[n - 1];
        svg += '<rect x="' + (wk * (cell + gap)) + '" y="' + (d * (cell + gap)) + '" width="' + cell + '" height="' + cell +
          '" rx="3" fill="' + fill + '"><title>' + date + ' · ' + s.items.map(function (i) { return i.name + i.done + '/' + i.target; }).join(' ') + '</title></rect>';
      }
      var first = C.shift(start, wk * 7);
      var m = C.parseYmd(first).getMonth() + 1;
      if (wk === 0 || (C.parseYmd(C.shift(start, wk * 7)).getDate() <= 7 && months.indexOf(m) < 0)) {
        months.push(m);
        svg += '<text x="' + (wk * (cell + gap)) + '" y="' + (hgt + 12) + '" font-size="9" fill="#9A8190">' + m + '月</text>';
      }
    }
    svg += '</svg>';
    var legend = '<div class="heat-legend"><span>少</span>';
    legend += '<i style="background:#F7EBF1"></i>';
    C.COLORS.forEach(function (c) { legend += '<i style="background:' + c + '"></i>'; });
    legend += '<span>多</span><span style="margin-left:8px">紫色 = 五项全清</span></div>';

    return '<div class="sec-head"><h2>' + I.grid + '每日热力图</h2><span class="hint">最近 26 周 · 一格一天</span></div>' +
      '<div class="card card-pad"><div class="heat-wrap">' + svg + '</div>' + legend + '</div>';
  }

  function bars() {
    var rs = C.subjectRates();
    var h = '<div class="sec-head"><h2>' + I.chart + '各科达标率</h2><span class="hint">按全部记录算，不受区间影响</span></div>' +
      '<div class="card card-pad"><div class="bars">';

      h += '<div class="bar-row"><span class="lb"><i style="background:' + r.color + '"></i>' + r.name + '</span>' +
        '<span class="track"><span style="width:' + (r.rate * 100).toFixed(1) + '%;background:' + r.color + '"></span></span>' +
        '<span class="vl">' + Math.round(r.rate * 100) + '%</span></div>';
    });
    h += '</div><div class="small muted" style="margin-top:10px">分母是从第一条记录到今天的天数（含空白天），共 ' +
      (rs[0] ? rs[0].days : 0) + ' 天。</div></div>';
    return h;
  }

  function dayList() {
    var today = C.todayStr();
    var base = C.parseYmd(today);
    var d = new Date(base.getFullYear(), base.getMonth() + UI.month, 1);
    var ym = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    var canNext = UI.month < 0;
    var canPrev = UI.month > -5;

    var h = '<div class="sec-head"><h2>' + I.list + '逐日记录</h2>' +
      '<div class="month-nav">' +
      '<button class="icon-btn" data-act="month" data-d="-1" ' + (canPrev ? '' : 'disabled style="opacity:.35"') + '>' + I.left + '</button>' +
      '<span class="small" style="min-width:88px;text-align:center">' + d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月</span>' +
      '<button class="icon-btn" data-act="month" data-d="1" ' + (canNext ? '' : 'disabled style="opacity:.35"') + '>' + I.arrow + '</button>' +
      '</div></div>';

    h += '<div class="card card-pad"><div class="day-list">' +
      '<div class="day-row head"><span>日期</span>' + C.SUBJECTS.map(function (s) { return '<span class="cell">' + s.name + '</span>'; }).join('') +
      '<span class="sum">达标</span></div>';

    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    var rows = 0;
    for (var i = 1; i <= last; i++) {
      var date = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + i).slice(-2);
      if (C.dayIndex(date) > C.dayIndex(today)) continue;
      var s = C.statsFor(date);
      rows++;
      h += '<div class="day-row"><span class="d">' + (d.getMonth() + 1) + '/' + i + ' ' + C.weekdayCN(date).replace('周', '') + '</span>' +
        s.items.map(function (it) {
          return '<span class="cell ' + (it.done === 0 ? 'zero' : it.ok ? 'ok' : '') + '">' + it.done + '</span>';
        }).join('') +
        '<span class="sum ' + (s.complete ? 'full' : '') + '">' + s.okCount + '/5</span></div>';
    }
    if (!rows) h += '<div class="small muted" style="padding:14px 0">这个月还没有记录。</div>';
    h += '</div></div>';
    return h;
  }

/* ---- boot.js ---- */
/* ===========================================================
   六级打卡台 · CET-6 Daily
   启动与交互层
