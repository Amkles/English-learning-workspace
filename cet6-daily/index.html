退役选手的转型，是行业需要面对的问题。","en":"Esports has become an official event at the Asian Games. Professional players train as intensively as traditional athletes, yet their careers are often shorter. How to support retired players in changing careers is a problem the industry has to face.","tip":["official event 正式比赛项目","as intensively as 与……同等强度","support sb in doing 支持某人做"]},{"id":"t088","lv":"hard","tp":"社会","zh":"住房问题牵动着大城市的年轻人。房价收入比居高不下，租房成为多数人的现实选择。近年来，保障性租赁住房的建设规模不断扩大，试图缓解这一矛盾。","en":"Housing concerns young people in big cities. With the price-to-income ratio remaining high, renting has become the realistic choice for most of them. In recent years, the construction of subsidised rental housing has been scaled up in an attempt to ease the tension.","tip":["price-to-income ratio 房价收入比","With ... remaining high 独立主格结构","be scaled up 规模扩大，被动语态"]},{"id":"t089","lv":"hard","tp":"科技","zh":"开源软件支撑着现代数字基础设施，却常由少数志愿者维护。一旦关键项目出现安全漏洞，影响会迅速扩散。如何为开源生态提供可持续的资金支持，已成为业界关注的话题。","en":"Open-source software underpins modern digital infrastructure, yet it is often maintained by a small number of volunteers. Once a critical project develops a security flaw, the impact spreads quickly. How to provide sustainable funding for the open-source ecosystem has become a topic of concern in the industry.","tip":["underpin 支撑，比 support 更强调基础性","Once 引导条件状语从句，主句用一般现在时","funding 资金，不可数"]},{"id":"t090","lv":"hard","tp":"教育","zh":"高校学科调整的速度正在加快。一些传统专业因就业市场萎缩而被撤销，人工智能、集成电路等方向则不断增设。这种调整反映了产业结构的变迁，也给学生选择专业带来不确定性。","en":"The adjustment of university disciplines is accelerating. Some traditional majors have been discontinued as their job markets shrink, while programmes in artificial intelligence and integrated circuits keep being added. Such adjustments reflect changes in the industrial structure and bring uncertainty to students choosing their majors.","tip":["discontinue a major 撤销专业","while 表对比，连接两个分句","bring uncertainty to 给……带来不确定性"]}],"writing":[{"id":"w001","tp":"书信通知","ti":"致谢外教","dir":"Directions: You have just finished a course taught by a foreign teacher. Write a letter to him or her to express your gratitude. You should write at least 120 words but no more than 180 words.","ol":["说明写信目的，感谢一学期的教导","具体说明哪一点帮助最大（如口语纠音、写作批改）","表达祝愿，希望保持联系"],"fr":["第一段：点明身份与写信目的——课程结束，写信致谢","第二段：举一个具体事例说明收获，避免空泛赞美","第三段：再次感谢，表达祝愿与保持联系的愿望"],"es":"Dear Mr. Smith,\n\nI am Li Ming, a student from Class Three. Now that the oral English course has come to an end, I am writing to express my sincere gratitude for your teaching over the past term.\n\nWhat impressed me most was the way you corrected my pronunciation. In the first weeks, I was afraid to speak in class because my accent made me nervous. You listened patiently, wrote the problem sounds on the board and asked me to practise them in short dialogues. Thanks to your encouragement, I can now give a presentation without reading every word.\n\nYour class has made English a habit rather than a subject for me. I will keep reading and speaking every day. I wish you all the best in your future work, and I hope we can stay in touch by email.\n\nYours sincerely,\nLi Ming","ph":["express my sincere gratitude for ... 对……表示诚挚感谢","What impressed me most was ... 给我印象最深的是……","Thanks to your encouragement ... 多亏你的鼓励","stay in touch with sb. 与某人保持联系"]},{"id":"w002","tp":"书信通知","ti":"邀请参加文化节","dir":"Directions: Your university is going to hold a Chinese Culture Festival. Write a letter to invite Professor Brown, a visiting scholar, to attend it. You should write at least 120 words but no more than 180 words.","ol":["说明活动名称、时间和地点","介绍活动内容与邀请理由","说明回复方式，表达期待"],"fr":["第一段：自我介绍，说明邀请事由","第二段：介绍时间、地点与主要环节，说明为何想到对方","第三段：请对方确认行程，表达期待"],"es":"Dear Professor Brown,\n\nI am Wang Fang, chair of the Student Union of the Foreign Languages School. On behalf of our school, I am writing to invite you to the Chinese Culture Festival, which will be held in the Student Centre from 2 p.m. to 6 p.m. on 20 May.\n\nThe festival will include calligraphy workshops, a tea ceremony and a short stage performance. Since you have studied Chinese poetry for many years, we would be honoured if you could give a ten-minute talk on how poetry reflects everyday life. Your talk would give students a fresh view of the culture they are learning about.\n\nPlease let me know whether you are available by 10 May so that we can arrange the seating and the schedule. We sincerely hope you can join us.\n\nYours sincerely,\nWang Fang","ph":["On behalf of ..., I am writing to invite you to ... 我代表……写信邀请您……","We would be honoured if you could ... 如您能……我们将深感荣幸","whether you are available 您是否有空","give students a fresh view of ... 让学生对……有新认识"]},{"id":"w003","tp":"书信通知","ti":"申请志愿者","dir":"Directions: A international sports event is recruiting volunteers. Write a letter to apply for the position. You should write at least 120 words but no more than 180 words.","ol":["说明申请岗位与信息来源","介绍自身优势（语言、经验、时间）","表达服务意愿，请求面试机会"],"fr":["第一段：说明从何处得知招募信息，申请何岗位","第二段：用具体经历说明自己为何合适","第三段：说明可投入时间，请求进一步联系"],"es":"Dear Sir or Madam,\n\nI am a second-year student majoring in English at Nanjing University. I learned from the volunteer recruitment notice that you are looking for assistants for the international sports event, and I would like to apply for the reception desk position.\n\nTwo points may make me a suitable candidate. First, I have passed CET-6 and worked as an interpreter for a foreign delegation during last year's campus fair, so I am used to communicating with visitors under pressure. Second, I am patient and organized; as a class monitor, I have arranged schedules for more than forty students.\n\nI will be free from 10 July to 20 August and can work six days a week. I would be grateful for the chance to attend an interview at your convenience.\n\nYours faithfully,\nLi Hua","ph":["I learned from ... that ... 我从……得知……","Two points may make me a suitable candidate. 两点或许能说明我适合这一岗位。","I am used to doing sth. 我习惯于做某事","at your convenience 在您方便的时候"]},{"id":"w004","tp":"书信通知","ti":"投诉图书馆噪音","dir":"Directions: Write a letter to the library to complain about the noise problem during the exam period. You should write at least 120 words but no more than 180 words.","ol":["说明投诉的具体问题与发生时间","说明对学习造成的影响","提出可行的改进建议"],"fr":["第一段：说明身份，指出问题所在区域与时段","第二段：描述具体情形及影响，语气克制","第三段：提出两三条可操作建议，期待回复"],"es":"Dear Sir or Madam,\n\nI am a junior student who studies in the library almost every day. I am writing to report a problem that has become serious during the exam period.\n\nIn the reading room on the third floor, students often discuss their group projects at normal speaking volume, and some watch videos without earphones. Last Tuesday I sat there for three hours but finished only half of my reading. Several classmates have moved to the canteen, which is far from ideal for quiet study.\n\nI would suggest setting aside one room for group discussion and putting up reminder signs at the entrance of the silent area. It would also help if staff walked through the reading room once every hour.\n\nI hope these suggestions will be considered, and I look forward to your reply.\n\nYours faithfully,\nZhang Wei","ph":["I am writing to report a problem ... 我写信反映一个问题","at normal speaking volume 以正常说话音量","set aside ... for ... 把……留作……之用","I look forward to your reply. 期待您的回复。"]},{"id":"w005","tp":"书信通知","ti":"建议改善食堂","dir":"Directions: Write a letter to the university president to suggest improvements to the campus canteen. You should write at least 120 words but no more than 180 words.","ol":["肯定现有优点，指出待改进之处","说明问题带来的具体不便","提出具体建议"],"fr":["第一段：说明写信目的，先肯定食堂的努力","第二段：指出两个具体问题（如排队时间、菜品单一）","第三段：给出可执行建议，表达信任"],"es":"Dear President,\n\nI am a sophomore writing to share some thoughts on the campus canteen. I would like to begin by thanking the staff, whose work has clearly improved since the new menu was introduced last term.\n\nTwo problems, however, still affect daily life. First, the queue at the second-floor window is often twenty minutes long between 12:00 and 12:30, which leaves little time for a short rest before afternoon classes. Second, vegetarian dishes are limited to one or two options, so students with special dietary needs often eat the same meal for a week.\n\nMay I suggest opening an extra window during peak hours and adding two vegetarian dishes each day? A simple online menu would also help students decide before they queue.\n\nThank you for your time, and I trust the canteen will continue to improve.\n\nYours sincerely,\nChen Jing","ph":["I would like to begin by thanking ... 首先我要感谢……","be limited to 仅限于","May I suggest ...? 我可以建议……吗？","during peak hours 在高峰时段"]},{"id":"w006","tp":"书信通知","ti":"道歉信（损坏借书）","dir":"Directions: You borrowed a book from your professor and accidentally damaged it. Write a letter to apologize. You should write at least 120 words but no more than 180 words.","ol":["说明事情经过，直接致歉","说明补救措施","再次致歉，承诺改进"],"fr":["第一段：开门见山说明来意并道歉","第二段：交代损坏经过，不找借口","第三段：提出赔偿或替换方案"],"es":"Dear Professor Liu,\n\nI am writing to apologize for damaging the book you kindly lent me last month, A Short History of Modern Europe.\n\nOn Friday I carried it in my backpack during a rainstorm. The bottom of the bag was wet, and about twenty pages at the back are now wrinkled. I only noticed the damage when I opened it in the library. I should have put it in a plastic folder, and I am sorry that I did not take better care of something you trusted me with.\n\nI have ordered a new copy, which should arrive early next week. I will bring it to your office as soon as it comes, and I am also happy to pay for any difference in price. I promise to be more careful with borrowed materials in the future.\n\nYours sincerely,\nZhao Lei","ph":["I am writing to apologize for ... 我写信为……道歉","I should have done ... 我本应该……","take care of 保管、照料","be happy to do 乐意做"]},{"id":"w007","tp":"书信通知","ti":"讲座通知","dir":"Directions: Write a notice for the student union about a lecture on time management. You should write at least 120 words but no more than 180 words.","ol":["说明讲座主题、主讲人与时间地点","介绍讲座内容与适合人群","说明报名方式与注意事项"],"fr":["第一段：通知事项，要素齐全（主题、主讲、时间、地点）","第二段：简介内容与收获","第三段：报名方式与截止时间"],"es":"Notice\n\nA lecture on time management will be held in Lecture Hall 2 from 7 p.m. to 8:30 p.m. on Wednesday, 15 November. The speaker is Dr. Wang Lei, a psychologist who has worked with university students for over ten years.\n\nThe lecture will focus on three questions: how to plan a week realistically, how to deal with interruptions, and how to keep energy levels steady during exam periods. Dr. Wang will also analyse two common habits that waste time and suggest practical alternatives. Students who often stay up late to finish assignments will find the talk especially useful.\n\nAdmission is free, but seats are limited to 150. Please scan the QR code on the poster to sign up before Monday, 13 November. Latecomers will be asked to stand at the back.\n\nStudent Union","ph":["will be held in ... from ... to ... 将于……在……举行","Admission is free. 免费入场。","seats are limited to 150 座位仅限 150 个","Latecomers will be asked to ... 迟到者将被要求……"]},{"id":"w008","tp":"书信通知","ti":"社团招新","dir":"Directions: Write a notice for a reading club recruiting new members. You should write at least 120 words but no more than 180 words.","ol":["介绍社团定位与活动频率","说明招新对象与要求","报名方式与截止时间"],"fr":["第一段：社团简介与活动安排","第二段：招新对象、人数与要求","第三段：报名方式、面试安排"],"es":"Notice\n\nThe Reading Club is looking for new members for the coming term. We meet every Thursday evening in Room 305 of the library, and each session lasts about ninety minutes. Members take turns to introduce a book, and the rest of the time is used for discussion.\n\nWe welcome students from all departments. What matters is not how many books you have read but whether you are willing to explain your ideas and listen to others. This term we plan to read six titles, including two novels and one work of popular science. Members will vote on the final list in the first meeting.\n\nTo join, please send your name, department and a short paragraph about a book you like to readingclub@campus.edu before 20 September. We will hold a brief interview for those who sign up.\n\nReading Club","ph":["take turns to do 轮流做","What matters is not ... but whether ... 重要的不是……而是是否……","vote on 对……进行投票","sign up 报名"]},{"id":"w009","tp":"书信通知","ti":"实习求职信","dir":"Directions: Write a letter to apply for a summer internship in a marketing company. You should write at least 120 words but no more than 180 words.","ol":["说明申请岗位与信息来源","结合课程与经历说明匹配度","说明实习时间，请求面试"],"fr":["第一段：申请岗位与信息来源","第二段：两项与岗位相关的能力，配具体证据","第三段：时间安排与联系方式"],"es":"Dear Ms. Green,\n\nI am writing to apply for the summer internship in your marketing department, as advertised on your company website. I am a third-year student of business administration at Sun Yat-sen University.\n\nMy coursework has given me a foundation in consumer behaviour and data analysis. Last semester my team designed a promotion plan for a local coffee shop and used a survey of 300 customers to decide which channel to invest in; the shop reported a 20 percent rise in weekend sales. I am also comfortable with Excel and have basic skills in Python for cleaning survey data.\n\nI am available from 1 July to 31 August for five days a week. I have attached my resume and would welcome the chance to discuss how I could contribute to your team.\n\nYours sincerely,\nLiu Yang","ph":["as advertised on ... 正如……上刊登的","My coursework has given me a foundation in ... 课程为我打下了……基础","be comfortable with 熟练使用","would welcome the chance to ... 希望能有机会……"]},{"id":"w010","tp":"书信通知","ti":"推荐同学","dir":"Directions: Write a letter to recommend your classmate for a scholarship. You should write at least 120 words but no more than 180 words.","ol":["说明推荐人与被推荐人关系","从学业与品格两方面说明理由","表达推荐结论"],"fr":["第一段：说明写信目的与认识时长","第二段：学业表现 + 一个具体事例","第三段：品格与团队贡献，明确推荐"],"es":"Dear Committee Members,\n\nI am writing to recommend my classmate Lin Yue for the National Scholarship. I have studied with her for two years and served with her on the class committee.\n\nLin Yue ranks third in a class of forty-five and has won the first prize in our university's mathematics competition. What distinguishes her, however, is her willingness to explain difficult problems to others. Before last term's final exams, she organised four review sessions and prepared summary sheets for the whole class. As a result, no one in our study group failed the course.\n\nShe is also reliable. When our group project lost a member halfway through, she took over the missing part without complaint and finished it on time.\n\nI believe she deserves the scholarship and recommend her without reservation.\n\nYours sincerely,\nHe Xin","ph":["What distinguishes her is ... 让她与众不同的是……","without complaint 毫无怨言","deserve 值得、应得","recommend her without reservation 毫无保留地推荐她"]},{"id":"w011","tp":"书信通知","ti":"询问课程信息","dir":"Directions: Write a letter to a language school to ask about a summer course. You should write at least 120 words but no more than 180 words.","ol":["说明自身情况与学习需求","询问课程安排、费用与住宿","说明希望收到回复的时间"],"fr":["第一段：自我介绍与学习目标","第二段：列出两三个具体问题","第三段：说明时间要求与联系方式"],"es":"Dear Sir or Madam,\n\nI am a university student in China and plan to spend four weeks in your city this summer to improve my English. I am writing to ask for more information about your intensive courses.\n\nFirst, could you tell me the difference between the general course and the examination course? I need to take an academic writing test in September, so I would like to know which one offers more practice in essay structure. Second, I would like to know the class size and whether teachers give individual feedback on written work. Finally, please let me know the total cost, including registration and teaching materials, and whether the school can help arrange accommodation with a host family.\n\nI hope to receive your reply before 15 April so that I can apply for a visa in time.\n\nYours faithfully,\nSun Qian","ph":["I am writing to ask for more information about ... 我写信想了解……的更多信息","the difference between A and B","individual feedback on ... 对……的个别反馈","in time 及时"]},{"id":"w012","tp":"书信通知","ti":"祝贺获奖","dir":"Directions: Your friend has won a national speech contest. Write a letter to congratulate him or her. You should write at least 120 words but no more than 180 words.","ol":["直接表达祝贺","回顾对方的努力过程，说明实至名归","送上祝愿，提出小聚"],"fr":["第一段：得知消息，表达祝贺","第二段：回忆准备过程，突出努力与坚持","第三段：祝愿与约定"],"es":"Dear Ming,\n\nI saw the news on the university website this morning: first prize in the national English speech contest. Congratulations! I read the report twice to make sure I had not mistaken the name.\n\nI still remember the evenings in March when you practised in the empty classroom. You recorded yourself, listened to the playback and rewrote the same opening five times. There were days when you almost gave up because your pronunciation would not cooperate, but you came back the next morning. The prize is not luck; it is the result of those months.\n\nI hope this gives you the confidence to try even bigger stages. When you are back on campus, let's have dinner and celebrate properly.\n\nYours,\nTao","ph":["I read the report twice to make sure ... 我把报道读了两遍以确认……","the playback 录音回放","The prize is not luck; it is the result of ... 这个奖不是运气，而是……的结果","celebrate properly 好好庆祝"]},{"id":"w013","tp":"书信通知","ti":"申请交换项目","dir":"Directions: Write a letter to apply for a one-semester exchange programme. You should write at least 120 words but no more than 180 words.","ol":["说明申请项目与自身专业","说明语言能力与跨文化经历","说明学习计划与回国打算"],"fr":["第一段：申请项目名称与专业背景","第二段：语言成绩 + 一段跨文化经历","第三段：选课计划与未来目标"],"es":"Dear Selection Committee,\n\nI am writing to apply for the one-semester exchange programme with the University of Leeds. I am a third-year student of environmental engineering.\n\nI have passed IELTS with an overall score of 7.0 and have studied two courses taught in English. In 2024 I joined a summer camp in Yunnan where I worked with volunteers from five countries to monitor water quality in a mountain village. That experience taught me how to explain technical findings to people without a scientific background, a skill I believe will be useful in Leeds.\n\nIf selected, I plan to take courses in water resource management and environmental economics. On returning, I hope to write my graduation thesis on urban drainage and to share what I have learned with younger students.\n\nThank you for considering my application.\n\nYours sincerely,\nWu Han","ph":["If selected, I plan to ... 如果入选，我计划……","an overall score of 7.0 总分 7.0","share what I have learned with ... 与……分享所学","Thank you for considering my application. 感谢考虑我的申请。"]},{"id":"w014","tp":"书信通知","ti":"给学弟学妹的备考建议信","dir":"Directions: Write a letter to freshmen offering advice on preparing for CET-6. You should write at least 120 words but no more than 180 words.","ol":["说明写信目的与自身经验","给出两三条可操作建议","鼓励坚持，说明心态重要性"],"fr":["第一段：自我介绍，说明刚通过考试","第二段：三条建议，按优先级排列","第三段：心态与鼓励"],"es":"Dear Freshmen,\n\nI am a senior who passed CET-6 last December. Since many of you have asked how to prepare, I would like to share three suggestions.\n\nFirst, treat vocabulary as a daily habit rather than a task before the exam. Twenty words a day for three months is far more effective than two hundred words in one week. Second, do real papers under timed conditions. Reading three passages in forty minutes feels very different from reading them without a clock. Third, keep a notebook of mistakes: after each paper, write down why you chose the wrong option, not just the correct answer.\n\nFinally, do not panic if your first mock score is low. Progress in listening and reading is slow at the beginning and then suddenly visible. Give the method eight weeks before you judge it.\n\nGood luck,\nXu Ming","ph":["treat A as B 把 A 当作 B","under timed conditions 在限时条件下","far more effective than 远比……有效","before you judge it 在你评判它之前"]},{"id":"w015","tp":"书信通知","ti":"图书捐赠通知","dir":"Directions: Write a notice about a book donation activity organised by the library. You should write at least 120 words but no more than 180 words.","ol":["说明活动目的、时间与地点","说明捐赠要求与图书去向","说明激励方式与联系方式"],"fr":["第一段：活动目的与安排要素","第二段：对图书的要求与不接受的范围","第三段：图书去向、纪念方式与咨询方式"],"es":"Notice\n\nThe library will hold a book donation activity from 1 to 10 December to help build small reading rooms in three rural primary schools.\n\nWe welcome textbooks, children's literature, popular science and dictionaries published after 2015. Books should be complete and free of heavy notes. Please do not bring magazines, examination papers or damaged copies, as they are difficult to use in a school library.\n\nAll donated books will be sorted by volunteers and delivered before the winter holiday. Donors will receive a card showing where their books are sent, and those who give more than ten books will have their names listed on the library website.\n\nDonations can be left at the service desk on the first floor between 9 a.m. and 5 p.m. For further information, please call 6789-1234.\n\nLibrary","ph":["free of heavy notes 无大量笔记","be sorted by volunteers 由志愿者分类","For further information, please call ... 详情请致电……","published after 2015 2015 年后出版"]},{"id":"w016","tp":"观点论证","ti":"大学是否应强制体育课","dir":"Directions: Some people believe physical education should be compulsory for all university students. Others think students should decide for themselves. What is your opinion? Write an essay of 120 to 180 words.","ol":["提出争议，给出明确立场","论述强制体育课的两个理由","承认自由选择的价值，但说明为何不足以替代"],"fr":["第一段：引入争议，明确赞成强制","第二段：理由一（健康习惯）+ 理由二（公平与基础技能）","第三段：让步 + 重申立场"],"es":"Should university students be required to take physical education? In my view, a compulsory course is justified, provided that it offers real choices.\n\nThe first reason is habit. Most students arrive with irregular sleeping hours, and few will voluntarily add exercise to a crowded timetable; a required class gives them a fixed weekly slot. The second is fairness: free facilities sound generous, but those who already play well use them most.\n\nOpponents argue that adults should manage their own time. That is reasonable in principle, yet the evidence from many campuses is that optional programmes attract mainly the already active. Compulsory does not mean uniform, so I would keep the requirement and let students choose the sport.\n\nTherefore, required physical education, with flexible options, serves students better than pure freedom.","ph":["provided that 只要（引导条件状语从句）","in practice 实际上","sound generous 听起来慷慨","That is reasonable in principle, yet ... 原则上合理，然而……"]},{"id":"w017","tp":"观点论证","ti":"人工智能会取代教师吗","dir":"Directions: Some argue that artificial intelligence will replace teachers in the near future. To what extent do you agree? Write an essay of 120 to 180 words.","ol":["明确不同意的程度","说明 AI 能替代的部分与不能替代的部分","给出人机协作的结论"],"fr":["第一段：部分同意，但整体否定「取代」","第二段：AI 的优势（个性化练习、即时反馈）与其局限","第三段：教师不可替代的职能 + 结论"],"es":"Will artificial intelligence replace teachers? I agree that it will take over part of their work, but the claim that it will replace them goes too far.\n\nAI is genuinely useful where practice must be repeated. It can generate unlimited exercises, mark grammar mistakes instantly and adjust the difficulty to each learner. A teacher with forty students cannot do this at three in the morning. Yet learning is not only the transfer of information. A good teacher notices that a quiet student has stopped asking questions, or that a joke has hurt someone. These judgements depend on relationship and context, which no model currently reads.\n\nMoreover, students learn how to argue by watching someone argue with them fairly. An algorithm can produce counter-arguments, but it cannot care whether the student is convinced.\n\nThe likely future is cooperation: AI handles routine practice and feedback, while teachers spend more time on motivation, discussion and guidance. Teachers will change, not disappear.","ph":["goes too far 说得过头了","take over 接管、接手","the transfer of information 信息传递","The likely future is cooperation 未来很可能是协作"]},{"id":"w018","tp":"观点论证","ti":"课堂上是否禁用手机","dir":"Directions: Some universities ban mobile phones in classrooms. Do you think this is a good policy? Write an essay of 120 to 180 words.","ol":["表明立场（有条件支持）","说明禁令的合理性与执行难点","提出替代方案"],"fr":["第一段：有条件支持禁令","第二段：注意力成本 + 执行中的问题","第三段：给出更细的方案（分场景）"],"es":"Should mobile phones be banned in classrooms? I support a partial ban, but not a blanket one.\n\nA phone on the desk reduces attention even when it is silent, and one student's notification distracts the whole row. In large lecture halls, the cost of a single glance is a lost paragraph of explanation. However, a total ban is difficult to enforce fairly. Teachers cannot inspect every bag, and rules that are widely broken teach students to ignore rules in general.\n\nIn seminars and labs, phones can stay in bags; in lectures where students take notes digitally, they may be used openly. Some instructors already ask everyone to place phones face down at the corner of the desk for the first ten minutes, which is easy to check.\n\nThe goal is not to punish devices but to protect attention. A clear, limited and consistently applied rule does that better than an absolute ban.","ph":["a blanket ban 一刀切禁令","The case for ... is strong ……的理由很充分","face down 面朝下","consistently applied 一致执行的"]},{"id":"w019","tp":"观点论证","ti":"网络匿名利大于弊吗","dir":"Directions: Some people say anonymity online does more harm than good. To what extent do you agree? Write an essay of 120 to 180 words.","ol":["说明不完全同意，需区分场景","匿名保护的价值（举报、求助、少数群体）","匿名的代价及分层治理"],"fr":["第一段：不同意「弊大于利」的整体判断","第二段：举出匿名不可替代的价值","第三段：承认代价 + 提出分层方案"],"es":"Does online anonymity do more harm than good? I do not think the question can be answered with a single judgement, because anonymity protects some speakers and shields others.\n\nAnonymity has real value. Employees who report safety problems, patients discussing rare diseases and students asking questions they fear are stupid all depend on it. In many cases, requiring a real name would silence exactly the people whose voices are most needed. At the same time, anonymity lowers the cost of abuse. Insults, threats and coordinated harassment spread faster when no one can be identified.\n\nThe sensible response is not to abolish anonymity but to make it accountable. Platforms can require verified identity at registration while displaying only a nickname, and they can suspend accounts whose behaviour is repeatedly reported. Readers can also be given tools to see an account's history.\n\nAnonymity is a tool, not a virtue. Its value depends entirely on the rules that surround it.","ph":["do more harm than good 弊大于利","silence exactly the people ... 恰恰让最需要发声的人沉默","make it accountable 让它可追责","a tool, not a virtue 是工具，不是美德"]},{"id":"w020","tp":"观点论证","ti":"毕业后去大城市还是小城市","dir":"Directions: Some graduates prefer to work in large cities, while others choose smaller cities. Which do you think is a better choice? Write an essay of 120 to 180 words.","ol":["说明选择取决于阶段与目标","大城市的机会与代价","小城市的机会与代价，给出建议"],"fr":["第一段：不宜一概而论，取决于职业阶段","第二段：大城市的优势与成本","第三段：小城市的优势与适用人群 + 建议"],"es":"Where should graduates start their careers: a metropolis or a smaller city? I believe the answer depends on the stage of one's career rather than on a general ranking of cities.\n\nLarge cities concentrate opportunities. In media, finance and technology, one district may hold more employers than an entire province, and changing jobs does not require moving house. The cost is equally concentrated: rent takes a third of a beginner's salary, and commuting consumes two hours a day.\n\nSmaller cities offer a different bargain. Housing is affordable, commuting is short, and a capable graduate may be given responsibility earlier than in a large firm. However, the range of employers is narrow, and a bad match is harder to escape.\n\nMy suggestion is to treat the first three years as a learning period. Start where the learning curve is steepest, then decide where to settle once the trade-offs are clear.","ph":["concentrate opportunities 集中机会","a fair trade 一笔公平的交易","a different bargain 另一种交易","where the learning curve is steepest 学习曲线最陡的地方"]},{"id":"w021","tp":"观点论证","ti":"是否赞成间隔年","dir":"Directions: Some students take a gap year before university. Do you think this is a wise choice? Write an essay of 120 to 180 words.","ol":["有条件赞成","间隔年能解决的具体问题","风险与前提条件"],"fr":["第一段：有条件赞成","第二段：间隔年带来的两项收益（方向感、独立性）","第三段：风险与前提（计划、经济、期限）"],"es":"Is a gap year before university a wise choice? It can be, but only when it is planned rather than simply postponed.\n\nA year of work, volunteering or travel can supply what school does not: a sense of what daily work actually feels like. Someone who spends six months assisting in a hospital ward learns more about whether she wants to be a doctor than any brochure can teach. Living away from parents also builds practical independence — managing a budget, dealing with a landlord, cooking.\n\nThe risks are real. A year without structure can become a year of scrolling, and the habit of study is easy to lose. Costs also vary enormously: travel requires money, and paid work may leave little time for reflection.\n\nTherefore, a gap year should have a written plan, a budget and a fixed end date. With these conditions, it is an investment; without them, it is only a delay.","ph":["planned rather than simply postponed 是有计划的，而非单纯推迟","supply what school does not 提供学校给不了的东西","The risks are real. 风险确实存在。","an investment ... a delay 是投资……是拖延"]},{"id":"w022","tp":"观点论证","ti":"纸质书会被电子书取代吗","dir":"Directions: Some people believe printed books will disappear as e-books become more popular. Do you agree? Write an essay of 120 to 180 words.","ol":["不同意完全取代","电子书的优势与使用场景","纸质书不可替代之处，结论为并存"],"fr":["第一段：不同意「消失」","第二段：电子书的效率优势","第三段：纸质书在深度阅读与记忆中的作用 + 结论"],"es":"Will printed books disappear? I doubt it. What we are seeing is a division of labour rather than a replacement.\n\nE-books are better for certain purposes. A student can carry hundreds of titles on one device, search a term across a library and read in the dark. For reference works and guides, the electronic form is cheaper.\n\nPrinted books, however, do something that screens do not. Studies of reading comprehension repeatedly find that people remember the structure of a long argument better on paper, partly because the position of a passage on a page becomes a memory cue. A physical book also invites undivided attention: there are no notifications at the edge of the page. That is why many students who read articles online still buy paper copies of the books they need to think with.\n\nPrinting may shrink, but it will not vanish. The two forms will serve different needs, and readers will be the better for having both.","ph":["a division of labour rather than a replacement 是分工而非取代","a memory cue 记忆线索","invite undivided attention 让人专注","be the better for 因……而受益"]},{"id":"w023","tp":"观点论证","ti":"大学排名是否有意义","dir":"Directions: University rankings are widely used but also widely criticised. What is your view? Write an essay of 120 to 180 words.","ol":["承认有限价值，指出主要问题","排名的问题：指标偏差、激励扭曲","如何正确使用排名"],"fr":["第一段：有限有用，但不能当作唯一依据","第二段：问题一（指标偏研究）+ 问题二（激励扭曲）","第三段：使用建议（分专业、看细分指标）"],"es":"Are university rankings meaningful? They are useful as a rough guide and dangerous as a final answer.\n\nTheir value lies in comparison. For a student who knows nothing about foreign institutions, a ranking provides a starting list and some information about research output. But the indicators are not neutral: most weight goes to publications and citations, which favour large science-heavy universities and say little about teaching.\n\nWhen a number becomes a target, institutions may recruit international students for the statistics rather than for the classroom, or split research into smaller papers to raise counts. Students then pay for a figure that measures something other than their education.\n\nThe sensible use is narrow: compare programmes rather than universities, look at subject-level tables, and treat the overall rank as one data point among many. A ranking can open a door, but it cannot tell you whether you will learn well behind it.","ph":["as a rough guide 作为粗略参考","indicators are not neutral 指标并非中立","When a number becomes a target ... 当数字变成目标……","one data point among many 众多数据点之一"]},{"id":"w024","tp":"观点论证","ti":"志愿服务是否应纳入必修","dir":"Directions: Some universities make volunteer service a graduation requirement. Do you agree with this practice? Write an essay of 120 to 180 words.","ol":["赞成但有条件","必修能带来的覆盖与公平","强制的风险与设计要点"],"fr":["第一段：总体赞成，但需设计得当","第二段：两个理由（覆盖面、打破圈层）","第三段：风险（形式化）+ 设计建议"],"es":"Should volunteer service be a graduation requirement? I support the idea, provided that the requirement is designed around real work rather than a signature.\n\nThe main argument for compulsion is coverage. If service is optional, it attracts students who are already motivated; a requirement brings in those who would never have tried, and some discover an interest they did not know they had. Service also puts students in contact with people outside the campus.\n\nThe risk is formalisation. When hours are counted, some students will find the easiest way to collect them: taking a photo, signing in and leaving. To avoid this, the requirement should be tied to a specific project with a supervisor, and assessment should be based on a short reflection rather than on the number of hours.\n\nCompulsory service is defensible only if it produces genuine contact. Otherwise it teaches students to treat community work as paperwork.","ph":["provided that 只要","tends to attract 往往会吸引","be tied to 与……挂钩","treat A as B 把 A 当作 B"]},{"id":"w025","tp":"观点论证","ti":"明星高收入是否合理","dir":"Directions: Some people think entertainers are overpaid. Others argue that their incomes reflect market demand. Discuss both views and give your opinion. Write an essay of 120 to 180 words.","ol":["呈现双方观点","市场逻辑的合理性与局限","给出自己的判断与调节方式"],"fr":["第一段：引出争议","第二段：市场观点 + 其局限（稀缺性被放大、外部性）","第三段：我的判断：收入本身不应设上限，但税收与分配需调节"],"es":"Are entertainers paid too much? The debate usually opposes fairness to freedom, but the two are less opposed than they appear.\n\nThose who defend high incomes point to demand: a film that sells a billion tickets can afford to pay its lead actor well. The limitation is that attention markets are winner-takes-all, so the gap between the first and second performer reflects distribution technology as much as talent.\n\nCritics reply that a nurse and an actor cannot be compared. That is true, but it does not follow that a salary cap is the answer; caps are easy to evade and hard to justify in a market economy.\n\nMy view is that the income itself is not the problem. The problem is what happens after it: if tax rules allow the highest earners to pay proportionally less, the sense of unfairness is justified. Progressive taxation and transparent contracts address the issue more effectively than moral criticism.","ph":["winner-takes-all 赢家通吃","as far as it goes 就其本身而言","It does not follow that ... 并不能由此推出……","progressive taxation 累进税制"]},{"id":"w026","tp":"观点论证","ti":"全英文授课是否可取","dir":"Directions: Some universities teach major courses entirely in English. Do you think this is a good practice? Write an essay of 120 to 180 words.","ol":["有条件支持","英文授课的收益","风险（理解深度、师生负担）与前提"],"fr":["第一段：有条件支持","第二段：收益（文献获取、国际交流）","第三段：风险与前提（师资、分层、过渡）"],"es":"Should major courses be taught entirely in English? I support the practice for advanced courses, but not as a blanket rule for every subject.\n\nTaught well, English-medium instruction removes a barrier. In computer science and economics, most current papers appear in English first, and a student who has discussed them in class can read the literature without translating every paragraph. It also prepares students for conferences and for international workplaces.\n\nThe risk is shallow learning. When both the subject and the language are new, students may understand the words but miss the argument. Weaker listeners quietly give up and rely on slides. A second problem is teacher supply: a lecturer who is brilliant in Chinese may become hesitant in English, and the loss is borne by students.\n\nThe condition, therefore, is support. Universities should train teachers, allow bilingual materials in the first year, and evaluate courses by what students actually learn rather than by the language on the timetable.","ph":["English-medium instruction 全英文授课","removes a barrier 消除障碍","The loss is borne by students 代价由学生承担","by the language on the timetable 以课表上的语言来评判"]},{"id":"w027","tp":"观点论证","ti":"博物馆是否应免费开放","dir":"Directions: Some people argue that museums should be free of charge. Do you agree? Write an essay of 120 to 180 words.","ol":["赞成免费，但需配套","免费带来的公共价值","成本问题与解决方案"],"fr":["第一段：赞成，但需解决经费","第二段：免费的三重价值（可及性、随机参观、公共属性）","第三段：成本与替代方案（政府拨款、特展收费、捐赠）"],"es":"Should museums be free? I believe they should, because a museum is closer to a public library than to a cinema.\n\nThe strongest argument is access. A ticket price of forty yuan is trivial for a middle-class family and decisive for a student or a retired worker. Free entry also changes behaviour: people drop in for half an hour, return to see one room properly, and bring visiting relatives. Charging by visit encourages a single exhausting tour instead.\n\nThere is, of course, a cost. Buildings, staff, insurance and conservation must be paid for. But the choice is not between free and bankrupt. Several models work: public funding covers core costs, temporary exhibitions charge separately, and shops and cafés generate income. Donations can be invited without being demanded.\n\nA society that keeps its collections behind a price tag teaches people that culture is a luxury. Free entry, supported by stable public funding, teaches the opposite.","ph":["is closer to A than to B 更像 A 而不像 B","trivial for ... decisive for ... 对……微不足道，对……却是决定性的","drop in 顺道来访","behind a price tag 藏在价签之后"]},{"id":"w028","tp":"观点论证","ti":"是否应限制私家车进城","dir":"Directions: Some cities restrict private cars in the city centre. Do you think this is a reasonable policy? Write an essay of 120 to 180 words.","ol":["赞成限制，但需替代方案","限制的理由（拥堵、污染、空间效率）","公平性与配套措施"],"fr":["第一段：赞成，前提是公共交通到位","第二段：三条理由","第三段：公平问题 + 配套（公交、停车换乘、豁免）"],"es":"Should cities restrict private cars in the centre? I think restriction is reasonable, but only where public transport can absorb the trips that cars no longer make.\n\nThe case rests on space. A single lane of road can move about 2,000 cars an hour, or up to 20,000 bus passengers. When a city centre dedicates most of its street space to cars, it is using its scarcest resource inefficiently. Restrictions also cut pollution at street level, where pedestrians and shopkeepers spend their days, and reduce the noise that makes ground-floor housing unattractive.\n\nThe fairness objection deserves an answer. A ban that falls on everyone hurts those who cannot afford to live near the centre or to change cars. Exemptions for residents, delivery vehicles and disabled drivers, together with park-and-ride schemes and frequent buses, make the policy bearable.\n\nRestriction is not a punishment for drivers. It is a decision about what a street is for.","ph":["absorb the trips 承接这些出行","The case rests on ... 理由在于……","The fairness objection deserves an answer. 公平性异议值得回应。","what a street is for 街道是为什么而存在"]},{"id":"w029","tp":"观点论证","ti":"网课能否替代线下课","dir":"Directions: Online courses have become common. Some say they can replace face-to-face classes. Do you agree? Write an essay of 120 to 180 words.","ol":["不同意完全替代","网课的优势与适用场景","线下课不可替代的部分"],"fr":["第一段：否定「替代」，主张混合","第二段：网课优势（可回看、跨地域、自定进度）","第三段：线下课的不可替代性（节奏、互动、责任感）+ 结论"],"es":"Can online courses replace face-to-face classes? They can replace some of them, but not the part that matters most.\n\nOnline courses have genuine advantages. A recorded lecture can be paused and replayed, which helps students whose first language is not the language of instruction. Geography stops mattering too: a student in a small town can attend a course given by a specialist a thousand miles away.\n\nWhat the screen struggles to reproduce is rhythm and obligation. In a room, a teacher reads confusion in five faces and slows down; a seminar forces each student to speak, and the awareness that one must speak is itself a form of learning. Deadlines set by a person whom you will meet on Thursday carry more weight than a timestamp on a platform.\n\nThe sensible arrangement is blended learning: lectures online, discussion and laboratory work in person. The question is not which mode is better, but which tasks belong to which.","ph":["the part that matters most 最重要的部分","Geography stops mattering. 地理位置不再重要。","carry more weight than 比……更有分量","which tasks belong to which 哪种任务属于哪种模式"]},{"id":"w030","tp":"观点论证","ti":"大学生是否应创业","dir":"Directions: Some people encourage university students to start businesses while studying. Others think students should focus on their studies. Discuss both views and give your opinion. Write an essay of 120 to 180 words.","ol":["说明两种观点各自的道理","创业的教育价值与风险","给出条件性建议"],"fr":["第一段：呈现两种立场","第二段：创业的价值（真实反馈、能力）+ 风险（时间、资金、失败成本）","第三段：我的判断：支持小规模试错，反对盲目投入"],"es":"Should university students start businesses while they are still studying? Both camps have a point, and the disagreement is really about scale.\n\nSupporters argue that a small venture teaches faster than a classroom. A student who tries to sell a product discovers within weeks whether anyone wants it. Critics reply that a start-up consumes the time that should go into a degree, and that most student businesses close within a year, leaving debts and missed courses.\n\nMy view is that the two positions can be reconciled by size. A project that can be run in ten hours a week, with little capital and a clear stop date, is educational. Borrowing money or delaying graduation to chase an idea is a different decision, and it should not be encouraged by policy or by fashion.\n\nLearning to build something is valuable; risking everything to prove it is not.","ph":["Both camps have a point 双方都有道理","the disagreement is really about scale 分歧其实在于规模","Failure at twenty-two is cheaper than ... 二十二岁失败比……代价小","reconcile A by B 通过 B 调和 A"]},{"id":"w031","tp":"现象分析","ti":"大学生熬夜","dir":"Directions: Write an essay analysing why many university students stay up late and what can be done about it. You should write 120 to 180 words.","ol":["描述现象与数据感","分析两三个原因","提出可行的改善办法"],"fr":["第一段：现象描述，给出具体场景","第二段：原因（作息惯性、宿舍环境、屏幕）","第三段：影响 + 建议"],"es":"Walk through any dormitory at one in the morning and you will still see screens glowing. Late sleeping has become normal among university students, and the reasons are not simply laziness.\n\nThree causes stand out. The first is a timetable mismatch: classes may start at eight, but the most productive hours for many young people are late at night, when the corridor is finally quiet. The second is the dormitory itself. One student's keyboard clicks and another's video call keep everyone awake, so the whole room drifts later together. The third is the phone, which offers endless short videos that make stopping feel like a decision rather than a default.\n\nThe effects are cumulative: poor concentration in morning classes, irregular meals and lower immunity. Simple countermeasures help more than lectures on willpower — switching off the main light at eleven, agreeing on quiet hours, and charging phones outside the bed.","ph":["stand out 突出、显眼","drift later together 一起越睡越晚","make stopping feel like a decision 让「停下来」变成一个需要决定的事","countermeasure 对策"]},{"id":"w032","tp":"现象分析","ti":"短视频占据碎片时间","dir":"Directions: Write an essay analysing the popularity of short videos and its effects on young people. You should write 120 to 180 words.","ol":["描述短视频的普及程度","分析其吸引力来源","讨论影响与应对"],"fr":["第一段：现象与规模","第二段：吸引力（即时反馈、低门槛、算法）","第三段：双面影响 + 建议"],"es":"Short videos have become the default way to fill a spare minute. On buses, in queues and between classes, the same gesture appears: thumb down, thumb up, repeat.\n\nThe attraction is well designed. Each clip delivers a complete reward in fifteen seconds, which is short enough to avoid boredom and long enough to feel satisfying. Production is cheap, so anyone can appear. Above all, the recommendation system learns quickly; after a few swipes it knows which topics hold your attention, and the next clip is always slightly better than the last.\n\nThe effects run both ways. Short videos spread practical knowledge fast — a cooking technique or a grammar point can reach millions in a day. But they also train attention to expect constant novelty, making a forty-page chapter feel unbearably slow.\n\nThe useful response is not abstinence but boundaries: a fixed time, a place where the app is not installed, and one long task finished before the first clip.","ph":["the default way to fill a spare minute 填补空闲时间的默认方式","The attraction is well designed. 吸引力是被精心设计的。","run both ways 有两面性","not abstinence but boundaries 不是戒断，而是设边界"]},{"id":"w033","tp":"现象分析","ti":"考研热","dir":"Directions: Write an essay analysing the growing number of students applying for postgraduate study. You should write 120 to 180 words.","ol":["描述报考人数增长","分析原因（就业门槛、专业兴趣、缓冲）","讨论隐忧与理性选择"],"fr":["第一段：现象描述","第二段：三重原因","第三段：隐忧（盲目跟风、资源错配）+ 建议"],"es":"The number of students sitting the postgraduate entrance examination has risen for most of the past decade, and in some provinces it now exceeds the number of undergraduates graduating.\n\nThree forces are at work. Employers increasingly use a master's degree as a filter, so a bachelor's certificate buys fewer interviews than it did ten years ago. Some students genuinely want to go deeper into a subject; a third group uses the examination as a buffer against a discouraging job market.\n\nThere is nothing wrong with any of these motives, but the third deserves scrutiny. A degree taken only to delay adulthood can leave graduates older but no clearer about their direction, and it adds to the mismatch between training and demand.\n\nThe sensible question before registering is not what others are doing but what the degree will let you do that you cannot do now.","ph":["Three forces are at work. 有三股力量在起作用。","buys fewer interviews 换来更少的面试机会","deserves scrutiny 值得审视","no clearer about their direction 对方向并没有更清楚"]},{"id":"w034","tp":"现象分析","ti":"城市养宠增多","dir":"Directions: Write an essay analysing why more urban households keep pets and what problems need attention. You should write 120 to 180 words.","ol":["描述现象","分析原因（独居、情感需求、消费）","指出问题与管理建议"],"fr":["第一段：现象与规模","第二段：原因（居住形态、情感补偿、社交媒体）","第三段：问题（弃养、扰民、医疗）+ 建议"],"es":"Pets have moved from the courtyard into the apartment. In many Chinese cities, the number of registered dogs and cats has grown faster than the number of households.\n\nThe reasons are partly structural. Smaller families and later marriages mean more people live alone, and a dog provides a routine and a reason to go outside. Emotional need is the second factor: a pet offers company without the complications of human relationships, and for elderly residents it may be the main daily conversation. Social media has amplified the trend by making pet ownership look like a lifestyle rather than a responsibility.\n\nThe problems are equally visible. Abandonment rises after holidays, barking disputes occupy neighbourhood committees, and veterinary costs surprise new owners. Registration, mandatory vaccination and a simple licence fee would help, but the deeper need is education before purchase: a pet is a fifteen-year commitment, not a purchase to be returned.","ph":["moved from the courtyard into the apartment 从院子搬进了公寓","amplify the trend 放大这一趋势","occupy neighbourhood committees 占用居委会的精力","a fifteen-year commitment 十五年的承诺"]},{"id":"w035","tp":"现象分析","ti":"「躺平」话语","dir":"Directions: Write an essay analysing the spread of the phrase 'lying flat' among young Chinese people. You should write 120 to 180 words.","ol":["说明该说法指什么、不等于什么","分析其社会背景","给出理性看法"],"fr":["第一段：界定概念，避免误读","第二段：背景（竞争强度、成本、期望落差）","第三段：评价：是信号不是方案"],"es":"The phrase 'lying flat' spread quickly among young Chinese people, and it is often misunderstood. It rarely means refusing to work; more often it means declining an extra promotion, an unpaid weekend or a competition whose prize seems unreachable.\n\nCompetition for good university places and stable jobs intensified at the same time as housing costs rose, so the distance between effort and reward widened. Many young people also grew up being told that any goal was achievable, and discovered in their twenties that this was not quite true.\n\nAs a slogan it is honest; as a plan it is weak. Withdrawing from competition may protect a person's health for a year, but it does not create the conditions for a better life.\n\nThe more useful reading is that the phrase is a signal. It tells employers and policymakers where the return on effort has become too low, and it invites them to respond.","ph":["declining an extra promotion 拒绝额外的晋升","the distance between effort and reward widened 努力与回报之间的距离拉大","give that gap a name 给这种落差一个名字","the return on effort 努力的回报"]},{"id":"w036","tp":"现象分析","ti":"电子支付普及","dir":"Directions: Write an essay analysing the near-total adoption of mobile payment in Chinese cities and its consequences. You should write 120 to 180 words.","ol":["描述普及程度","分析效率收益","讨论被忽略的代价与补救"],"fr":["第一段：现象，从现金到扫码","第二段：效率、卫生、可追溯","第三段：代价（数字鸿沟、隐私、断网）+ 补救"],"es":"In most Chinese cities, paying with cash now feels unusual. From street vendors to hospitals, a QR code has replaced the note and the coin.\n\nThe efficiency gains are real. A queue moves faster when no one is counting change, small transactions become economically possible, and records are automatic, which helps both households and tax authorities. Contactless payment also reduced physical contact during the pandemic and cut the cost of handling cash.\n\nThe costs are less visible. Elderly people who cannot operate a smartphone find ordinary shopping difficult, and tourists without a local account are locked out of many services. Every payment also produces a data trail that can be used for profiling. And a payment system that depends on electricity and signal fails exactly when a crowd most needs it.\n\nThe remedy is not to reject the technology but to keep alternatives alive: cash must remain legal tender, and machines should still accept cards.","ph":["street vendors 街头小贩","locked out of 被排除在外","a data trail 数据痕迹","legal tender 法定货币"]},{"id":"w037","tp":"现象分析","ti":"博物馆热","dir":"Directions: Write an essay analysing why museums have become popular among young people. You should write 120 to 180 words.","ol":["描述参观热潮","分析原因（文化认同、社交分享、产品创新）","指出隐忧与建议"],"fr":["第一段：现象，预约一票难求","第二段：三方面原因","第三段：隐忧（打卡式参观）+ 建议"],"es":"Tickets for major museums now disappear within minutes of release. A decade ago, the same institutions were quiet on weekday afternoons.\n\nThree factors explain the change. First, cultural confidence: young visitors are less inclined to treat Western art as the default standard and more curious about their own history. Second, the visit has become social content; a well-lit exhibition hall is a good place for photographs, and sharing them signals taste. Third, museums have learned to design: creative products, themed cafés and evening openings turn a hall of objects into an experience.\n\nThe risk is that the queue becomes the point. Visitors who spend forty minutes photographing and ten minutes looking learn little, and crowded halls make deep viewing impossible.\n\nThe remedy lies with the museums themselves: timed entry, quieter routes for those who want to read labels, and exhibitions that reward attention rather than a camera.","ph":["disappear within minutes of release 放票几分钟内就没了","less inclined to treat A as the default 不太会把 A 当作默认标准","turn A into B 把 A 变成 B","reward attention rather than a camera 奖励专注而非相机"]},{"id":"w038","tp":"现象分析","ti":"乡村民宿兴起","dir":"Directions: Write an essay analysing the growth of rural guesthouses in China. You should write 120 to 180 words.","ol":["描述增长","分析驱动因素","讨论同质化与社区影响"],"fr":["第一段：现象","第二段：需求端 + 供给端","第三段：问题（同质化、房价、社区）+ 建议"],"es":"Rural guesthouses have multiplied along the edges of cities. What began as a few converted farmhouses is now an industry with design awards and booking platforms.\n\nOn the demand side, travel habits have changed. After years of rushed sightseeing, urban families want shorter trips with slower schedules, and a two-night stay in a village fits a weekend better than a flight. On the supply side, improved roads and internet access made remote locations viable, while local governments offered subsidies to encourage renovation.\n\nThe problems appear once the model succeeds. Villages begin to look alike, with the same white walls, the same swing and the same breakfast, so price becomes the only difference. Rents rise, and young villagers may be priced out of their own community.\n\nWhat sustains a destination is not decoration but distinctiveness: local food, local crafts and hosts who actually live there. Subsidies should reward that, not the number of rooms.","ph":["converted farmhouses 改造过的农舍","fit a weekend better than a flight 比坐飞机更适合周末","be priced out of 因价格被挤出","What sustains a destination is ... 支撑一个目的地的是……"]},{"id":"w039","tp":"现象分析","ti":"健身热潮","dir":"Directions: Write an essay analysing the fitness boom among urban Chinese. You should write 120 to 180 words.","ol":["描述健身人群扩大","分析原因","讨论消费化倾向与理性健身"],"fr":["第一段：现象（健身房、跑步、居家训练）","第二段：健康意识、审美变化、社交平台","第三段：隐忧（办卡不练、过度消费）+ 建议"],"es":"Fitness has become a visible part of urban life. Gyms open before seven, parks fill with runners at dusk, and home workout videos collect millions of views.\n\nThe motives have shifted. Twenty years ago, exercise was mostly associated with competition or weight loss; today it is presented as a way of managing stress and energy. Health check-ups that report fatty liver or high blood pressure persuade people in their thirties, while social platforms make progress visible and therefore comparable. Cheap wearable devices add a daily number to aim at.\n\nThere is a commercial side that deserves scepticism. Annual memberships are sold on the assumption that most buyers will stop coming after February, and supplements promise results that training alone would deliver.\n\nThe healthy version of the trend is unglamorous: three sessions a week, a routine that fits the schedule, and progress measured in months rather than in purchases.","ph":["collect millions of views 获得数百万播放","persuade people in their thirties 让三十多岁的人下决心","deserves scepticism 值得怀疑","unglamorous 不光鲜的"]},{"id":"w040","tp":"现象分析","ti":"网络用语进入日常","dir":"Directions: Write an essay analysing the influence of internet slang on everyday language. You should write 120 to 180 words.","ol":["描述现象","分析其功能与风险","提出语言使用的态度"],"fr":["第一段：现象（口语、作文、广告）","第二段：功能（效率、认同）+ 风险（表达粗糙、语境错位）","第三段：态度：分场合"],"es":"Internet slang has moved from comment sections into classrooms, advertisements and even examination scripts. A phrase invented for a joke can become the standard way to describe an emotion within a year.\n\nSlang does real work. It compresses a complicated feeling into two characters, which is useful in fast conversation, and it signals membership in a group. For young people, using the current word is a way of saying 'I belong here'.\n\nThe risk is a narrowing of expression. If every disappointment is described by the same word, the difference between disappointment, irritation and grief disappears. Slang also dates quickly: a phrase that sounds natural to a fifteen-year-old may sound absurd to an examiner, and using it in a formal essay costs marks.\n\nThe sensible attitude is register awareness. Slang belongs in chat and in friendly speech; formal writing requires words that will still mean the same thing in ten years.","ph":["does real work 有其实际功能","a narrowing of expression 表达的窄化","date quickly 很快过时","register awareness 语域意识"]},{"id":"w041","tp":"现象分析","ti":"独居青年增多","dir":"Directions: Write an essay analysing the rise of solo living among young adults. You should write 120 to 180 words.","ol":["描述数据趋势","分析原因（婚育推迟、迁移、经济）","讨论影响与应对"],"fr":["第一段：现象与规模","第二段：三重原因","第三段：影响（自由与孤独）+ 社会应对"],"es":"More young adults in Chinese cities now live alone than at any time in the past. The trend is visible in the housing market: small flats and single-room rentals are the fastest-growing segment.\n\nThree factors drive it. Marriage and childbirth are happening later, so there is a longer period between graduation and forming a household. Internal migration separates young workers from their hometowns, and renting alone is often cheaper than sharing a flat in a convenient location. Rising incomes also make solitude purchasable, which was not true a generation ago.\n\nSolo living has real benefits: control over time, no negotiation over housework, and space to develop habits. Its cost is loneliness, which arrives not in dramatic moments but on ordinary evenings, and which research links to poorer health.\n\nThe response should be social rather than moral. Shared kitchens, community sports and public spaces that make casual contact possible do more than advising young people to marry sooner.","ph":["the fastest-growing segment 增长最快的部分","solitude purchasable 独处成为可购买的商品","arrives not in dramatic moments but on ordinary evenings 不在戏剧性时刻到来，而在普通夜晚","casual contact 随意的接触"]},{"id":"w042","tp":"现象分析","ti":"二手交易流行","dir":"Directions: Write an essay analysing the popularity of second-hand trading among young consumers. You should write 120 to 180 words.","ol":["描述现象","分析动因（经济、环保、新奇）","讨论信任问题与规范化"],"fr":["第一段：现象","第二段：三重动因","第三段：问题（真假、售后）+ 建议"],"es":"Buying used has lost its stigma. Second-hand platforms now list everything from textbooks to designer bags, and a large share of their users are under thirty.\n\nRents and living costs take a bigger share of a young salary than for their parents, so paying half price for a desk or a bicycle is simply rational. Environmental concern is the second: a generation that has heard about carbon footprints finds it inconsistent to buy new furniture for a one-year lease. The third motive is discovery — a used item is unique, and hunting for it is entertaining in a way that a shopping cart is not.\n\nPhotographs can hide damage, descriptions can be optimistic, and returning an item to a private seller is difficult. Platforms that offer authentication, escrow payment and standard returns grow faster than those that do not.\n\nSecond-hand trading is not a temporary response to hard times; it is a more efficient use of things already made.","ph":["lose its stigma 不再带有污名","take a bigger share of 占更大比例","find it inconsistent to do 觉得做某事不合逻辑","escrow payment 担保支付"]},{"id":"w043","tp":"现象分析","ti":"城市马拉松热","dir":"Directions: Write an essay analysing why marathons have become popular in Chinese cities. You should write 120 to 180 words.","ol":["描述赛事增长","分析参与者与城市两方面的动机","讨论问题与改进"],"fr":["第一段：现象","第二段：个人动机（健康、目标感）+ 城市动机（形象、消费）","第三段：问题（中签难、扰民、安全）+ 建议"],"es":"A generation ago, a marathon in a Chinese city was a rare event organised for professional athletes. Today dozens of cities hold races each year, and entry places are allocated by lottery.\n\nFor runners, the appeal is a goal with a date. Training for 42 kilometres imposes structure on an otherwise flexible week, and finishing provides a sense of achievement that a gym session cannot. For cities, a race is compact publicity: roads are closed for a morning, and images of the skyline travel further than most advertising campaigns.\n\nThe problems are predictable. Residents complain about closed roads, medical staff worry about untrained runners who ignore warnings, and the lottery leaves many disappointed. Some races have also become expensive exhibitions of equipment.\n\nImprovements are straightforward: more half-marathons for beginners, better medical screening, and routes that disturb fewer neighbourhoods. A race works when it belongs to the city, not only to the sponsor.","ph":["allocated by lottery 通过抽签分配","imposes structure on 给……强加结构","compact publicity 紧凑的宣传","belongs to the city 属于这座城市"]},{"id":"w044","tp":"现象分析","ti":"国潮消费","dir":"Directions: Write an essay analysing the rise of 'national trend' consumption among Chinese young people. You should write 120 to 180 words.","ol":["描述消费现象","分析原因（设计提升、文化认同、供应链）","指出风险与长期之道"],"fr":["第一段：现象（国产运动品牌、联名、非遗元素）","第二段：三重原因","第三段：风险（符号化、溢价）+ 长期建议"],"es":"Products labelled 'national trend' now fill the shelves that foreign brands once dominated. Sneakers with embroidered patterns, tea drinks named after poems and cosmetics packaged like porcelain are bought by consumers in their twenties.\n\nDesign quality explains part of it. Chinese brands hired the same designers who once worked for international labels, and the gap in appearance closed quickly. Cultural confidence explains another part: young buyers no longer assume that imported means better, and they enjoy recognising a reference that older generations also understand. Finally, the supply chain is local, so a new idea can reach shops in weeks rather than seasons.\n\nThe risk is that the label replaces the product. When a plain T-shirt costs twice as much because of a printed character, the trend becomes a tax on patriotism, and customers notice.\n\nThe brands that last will be those whose quality survives without the label. Culture sells the first purchase; only the product sells the second.","ph":["fill the shelves 摆满货架","the gap in appearance closed 外观上的差距缩小了","a tax on patriotism 对爱国情绪的征税","Culture sells the first purchase 文化带来第一次购买"]},{"id":"w045","tp":"现象分析","ti":"远程办公的常态化","dir":"Directions: Write an essay analysing the normalisation of remote work and its effects. You should write 120 to 180 words.","ol":["描述变化","分析对个人与组织的影响","讨论混合模式的边界"],"fr":["第一段：现象，从应急到常态","第二段：收益（通勤、专注、地域）+ 代价（边界模糊、协作变慢）","第三段：混合模式的关键规则"],"es":"Remote work began as an emergency measure and has settled into a routine. Many companies now allow two or three days at home each week, and job advertisements list flexibility alongside salary.\n\nThe gains are clear. Removing the commute returns one to two hours a day, and those hours often go into work or sleep rather than leisure. Concentrated tasks such as writing and coding proceed faster without interruptions. Companies benefit too, because they can hire beyond commuting distance.\n\nThe costs are less obvious but real. Home and office merge, so the working day expands at both ends, and junior employees lose the incidental learning that comes from overhearing a senior colleague. Decisions that once took a corridor conversation now take three days of messages.\n\nThe hybrid model works only with explicit rules: fixed days together for discussion, clear expectations about response time, and meetings that have an agenda. Flexibility without structure becomes invisibility for those who are least assertive.","ph":["settled into a routine 变成常态","incidental learning 附带的学习","corridor conversation 走廊里的对话","invisibility for those who are least assertive 对最不善表达的人而言就是被忽视"]},{"id":"w046","tp":"名言评论","ti":"关于「行胜于言」","dir":"Directions: Comment on the saying 'A journey of a thousand miles begins with a single step.' Write an essay of 120 to 180 words.","ol":["解释名言的真正含义","说明为何「第一步」常被高估或低估","给出自己的体会"],"fr":["第一段：释义，指出重点不在「千里」而在「一步」","第二段：反面现象（计划代替行动）+ 正面例子","第三段：结论，把大目标切成可执行的第一步"],"es":"Laozi's observation that a journey of a thousand miles begins with a single step is often quoted and rarely practised. Its point is not that the journey is long, but that length is irrelevant until movement starts.\n\nMost people who fail to begin do not lack ambition; they lack a first step small enough to take today. A student who plans to read fifty books this year may read none, because the plan implies a commitment that feels heavy; the same student will finish a book if this evening's task is twenty pages.\n\nThe saying also warns against a different error: treating the first step as the whole journey. Starting is easy to celebrate and hard to repeat. What produces the thousand miles is the second step, and the hundredth, taken when no one is watching.\n\nBegin small, then keep the size of the beginning.","ph":["is often quoted and rarely practised 常被引用，很少被实践","small enough to take today 小到今天就能迈出","cheap enough to survive a bad day 代价小到能在糟糕的一天里完成","treat A as B 把 A 当作 B"]},{"id":"w047","tp":"名言评论","ti":"关于「知识就是力量」","dir":"Directions: Comment on Francis Bacon's saying 'Knowledge is power.' Write an essay of 120 to 180 words.","ol":["解释这句话的历史语境","指出知识转化为力量的条件","联系当下，给出判断"],"fr":["第一段：解释原意（知识改变人对自然的关系）","第二段：转化条件（应用、判断、分享）","第三段：今天更需警惕「有知识无判断」"],"es":"When Francis Bacon wrote that knowledge is power, he was arguing against a view of learning as decoration. Knowledge, in his account, is power because it allows people to predict and therefore to act.\n\nThe claim needs a condition. Information stored is not power; it becomes power when it is applied to a decision. A physician who has read every paper on a disease but cannot explain a diagnosis to a frightened patient has knowledge and little power. The same is true of a student who memorises formulas without knowing when they fail.\n\nOur era adds a new problem. Access to information has become almost free, so the scarce resource is no longer knowledge itself but judgement about which knowledge to trust. Someone who forwards a plausible chart without checking its source has more information and less power than before.\n\nBacon's sentence therefore remains true, but with a qualification: knowledge becomes power only when it is tested, applied and communicated.","ph":["argue against a view of ... 反对把……看作……的观点","in his account 在他看来","The claim needs a condition. 这一说法需要条件。","with a qualification 附带一个限定"]},{"id":"w048","tp":"名言评论","ti":"关于「反复做的事」","dir":"Directions: Comment on the saying 'We are what we repeatedly do.' Write an essay of 120 to 180 words.","ol":["解释习惯与身份的关系","举例说明习惯的复利效应","讨论如何改变习惯"],"fr":["第一段：释义，习惯塑造身份","第二段：正例与反例（每天二十分钟与每天刷两小时）","第三段：改变的方法（环境设计、最小单位）"],"es":"The saying that we are what we repeatedly do, usually attributed to Aristotle, is a claim about identity rather than achievement. It suggests that character is not chosen in a single decision but accumulated in small repetitions.\n\nTwenty minutes of reading a day is roughly twelve books a year; two hours of short videos a day is a month of waking life. Neither choice feels important on a Tuesday evening, which is precisely why the choice is important.\n\nWillpower is a poor instrument because it is exhausted by use. Environment works better: a book on the pillow, the app removed from the first screen, a friend who expects you at seven in the morning. Starting with a unit so small that refusing it would be absurd also helps, because the difficulty of beginning is the main obstacle.\n\nWe become what we repeat, so the useful work is designing what gets repeated.","ph":["a claim about identity 关于身份的主张","The arithmetic is unglamorous. 算术本身并不光鲜。","Willpower is a poor instrument 意志力不是好工具","the difficulty of beginning 开始的难度"]},{"id":"w049","tp":"名言评论","ti":"关于「阅读使人充实」","dir":"Directions: Comment on Bacon's line 'Reading makes a full man.' Write an essay of 120 to 180 words.","ol":["解释「full」的多重含义","辨析阅读与经验的关系","给出阅读建议"],"fr":["第一段：解释 full（知识、语言、判断）","第二段：阅读的局限，需要经验校验","第三段：如何读（带着问题、读写结合）"],"es":"Bacon's line that reading makes a full man is usually read as praise of books. It is also a description of what reading does to a mind: it supplies material that experience alone cannot provide.\n\nA reader gains three things. The first is range: a person who has read history recognises a pattern in the news that others see as unprecedented. The second is language: sentences are learned by exposure, and a student who reads good prose begins to write differently without studying grammar. The third is judgement, though this is where the claim needs care.\n\nReading can also make a person full of other people's opinions. Bacon himself added that reading should be combined with discussion and writing, because material unprocessed becomes weight rather than strength.\n\nThe practical conclusion is to read with a question and to write something after reading. A book that changes no sentence you write has probably not been read, only finished.","ph":["is usually read as 通常被理解为","supplies material that experience alone cannot provide 提供单靠经验无法获得的材料","this is where the claim needs care 正是在这里需要谨慎","material unprocessed becomes weight 未经处理的材料会变成负担"]},{"id":"w050","tp":"名言评论","ti":"关于「热爱你的工作」","dir":"Directions: Comment on Steve Jobs' advice 'The only way to do great work is to love what you do.' Write an essay of 120 to 180 words.","ol":["承认热爱的价值","指出这句话的适用边界","给出更现实的表述"],"fr":["第一段：肯定热爱带来的投入","第二段：边界（多数人无法先热爱再选择；热爱也可后天形成）","第三段：改写这句话"],"es":"Steve Jobs told graduates that the only way to do great work is to love what you do. The advice is inspiring and slightly incomplete.\n\nIt is right about effort. A programmer who enjoys debugging will stay an hour longer than one who does not, and over a decade those hours compound.\n\nBut the sentence assumes that love comes first. For most people, work is chosen under constraints: a visa, a family obligation, a salary that must cover rent. Telling them to find their passion can turn a structural problem into a personal failure. In practice, interest often grows after competence: a person becomes good at something, is trusted with harder tasks, and begins to care.\n\nA more honest version would be: do work you can respect, get good at it, and let affection follow. Love is often a result of mastery rather than a precondition for it.","ph":["is slightly incomplete 略有欠缺","compound 累积","turn a structural problem into a personal failure 把结构性问题变成个人失败","a precondition for 的前提"]},{"id":"w051","tp":"名言评论","ti":"关于「未审视的人生」","dir":"Directions: Comment on Socrates' statement 'The unexamined life is not worth living.' Write an essay of 120 to 180 words.","ol":["解释「审视」指什么","说明反思的价值与风险","给出可操作的反思方式"],"fr":["第一段：释义，审视指追问依据","第二段：价值（纠错、方向）+ 风险（过度反思导致瘫痪）","第三段：方法（定期复盘、写作、他人反馈）"],"es":"Socrates' claim that the unexamined life is not worth living is a strong statement, and it is worth taking seriously without taking it literally.\n\nTo examine a life is to ask why one is doing what one is doing: whether the goal is chosen or inherited, whether the method actually works, whether the cost is acceptable. This is uncomfortable because the answers are often no. But a person who never asks will spend years optimising a route to a destination someone else selected.\n\nEndless self-analysis can replace action, and a habit of doubting every motive produces paralysis rather than clarity. Reflection is useful when it ends in a decision and harmful when it becomes a substitute for one.\n\nA workable version is periodic rather than constant: a monthly review of what was planned and what happened, a page of writing when a choice feels difficult, and one honest friend who will tell you what you avoid.","ph":["without taking it literally 不必照字面理解","inherited 承袭而来的","optimising a route to a destination someone else selected 优化一条通往别人选定目的地的路线","a substitute for one 行动的替代品"]},{"id":"w052","tp":"名言评论","ti":"关于「天才与勤奋」","dir":"Directions: Comment on Edison's remark that genius is one percent inspiration and ninety-nine percent perspiration. Write an essay of 120 to 180 words.","ol":["解释这句话针对的偏见","讨论灵感与勤奋的真实关系","给出对学习者的启示"],"fr":["第一段：解释爱迪生的话针对「天赋论」","第二段：灵感并非可省略，但需积累承接","第三段：对备考者的具体启示"],"es":"Edison's remark that genius is one percent inspiration and ninety-nine percent perspiration is usually quoted to encourage effort. Its sharper point is that the one percent only becomes visible after the ninety-nine.\n\nMost people who study a field long enough produce several plausible ideas a year; what separates them is the willingness to test one, fail, and test again. The metaphor is slightly unfair to inspiration, because a good question is worth more than a hundred routine experiments. Yet good questions rarely arrive to beginners; they arrive after enough exposure for a pattern to be noticed.\n\nRe-reading notes feels productive and changes little, because it produces familiarity rather than recall. Attempting questions, getting them wrong and correcting the errors is unpleasant and effective.\n\nEdison's percentages need not be taken literally. The direction is what matters: effort is the part you control, and it is also the part that makes the other one percent possible.","ph":["Its sharper point is that ... 更锋利的一点是……","be unfair to 对……不公平","arrive after enough exposure 在足够接触之后才出现","familiarity rather than recall 熟悉感而非提取"]},{"id":"w053","tp":"名言评论","ti":"关于「独行与同行」","dir":"Directions: Comment on the proverb 'If you want to go fast, go alone; if you want to go far, go together.' Write an essay of 120 to 180 words.","ol":["辨析「快」与「远」的取舍","说明协作的代价与收益","给出自己的判断"],"fr":["第一段：解释谚语的两面","第二段：独行的效率与协作的复利","第三段：判断：短期独行，长期协作"],"es":"The proverb that you go fast alone and far together contains a useful distinction: speed and distance are different objectives, and they are served by different arrangements.\n\nDecisions take minutes rather than meetings, and a single person can hold a whole problem in mind without translating it for others. This is why the early stage of a project is often best done by one person. But most substantial goals exceed one person's knowledge. A team brings different training, catches errors that its author cannot see, and continues after any individual leaves.\n\nThe cost of cooperation is coordination. Every additional member adds communication channels, and a group can spend more time agreeing than doing. That is why teams need a clear owner, a shared document and a deadline, rather than endless consensus.\n\nMy reading is that the proverb describes a sequence rather than a choice: go alone to find the direction, then go together to cover the distance.","ph":["a useful distinction 一个有用的区分","hold a whole problem in mind 把整个问题装在心里","exceed one person's knowledge 超出个人知识范围","describes a sequence rather than a choice 描述的是一段顺序，而非一个选择"]},{"id":"w054","tp":"名言评论","ti":"关于「失败」","dir":"Directions: Comment on the saying 'Failure is the condiment that gives success its flavour.' Write an essay of 120 to 180 words.","ol":["解释比喻的含义","区分「有价值的失败」与「重复的失败」","提出对待失败的方法"],"fr":["第一段：释义，失败提供对照","第二段：有价值的失败有条件（复盘、可控代价）","第三段：方法：记录、归因、再试"],"es":"The image of failure as a condiment is appealing: without something bitter, success would taste bland. As a description of how memory works, it is accurate. People recall the exam they failed far longer than the one they passed easily.\n\nBut not every failure is nutritious. A failure becomes useful under two conditions. The first is a review: what went wrong, at which step, and what would be done differently. The second is a bearable cost: a failed course can be retaken, but a failure that consumes a family's savings teaches nothing worth the price.\n\nThe practical habit is to separate the event from the judgement. 'I did not prepare the listening section' is a fact that can be acted on; 'I am bad at English' is a verdict that cannot. The first leads to a plan, the second to nothing.\n\nFailure flavours success only when it is digested.","ph":["As a description of how memory works 作为对记忆机制的描述","nutritious 有营养的（比喻）","a bearable cost 可承受的代价","only when it is digested 只有被消化之后"]},{"id":"w055","tp":"名言评论","ti":"关于「时间」","dir":"Directions: Comment on the saying 'Time is the most valuable thing a man can spend.' Write an essay of 120 to 180 words.","ol":["解释时间与金钱的差异","说明「花费时间」的判断标准","联系学生生活"],"fr":["第一段：时间不可储存、不可再生","第二段：判断标准（不可替代性、复利）","第三段：学生的具体取舍"],"es":"The saying that time is the most valuable thing a person can spend is easy to agree with and hard to act on, because time does not feel scarce until it is gone.\n\nMoney differs from time: it can be stored, and it can be earned again. Time can do neither, so a rich person may be poor in the one currency that cannot be replenished.\n\nIf time is the currency, the question becomes how to spend it well. Two criteria help. The first is irreplaceability: some hours produce things that cannot be bought later, such as a conversation with a grandparent or the first year of a child's life. The second is compounding: an hour spent learning a language or building a habit pays again every year, while an hour of scrolling pays once.\n\nFor students, this is not an argument for constant study. It is an argument for spending the irreplaceable hours deliberately and the rest without guilt.","ph":["does not feel scarce until it is gone 直到失去才觉得稀缺","This asymmetry explains ... 这种不对称解释了……","irreplaceability 不可替代性","an argument for ... 一个支持……的理由"]},{"id":"w056","tp":"名言评论","ti":"关于「教与学」","dir":"Directions: Comment on the saying 'Tell me and I forget; teach me and I remember; involve me and I learn.' Write an essay of 120 to 180 words.","ol":["解释三个层次的差别","用学习科学的视角说明原因","给出可操作的学习方式"],"fr":["第一段：解释从听讲到参与的递进","第二段：原因（提取练习、输出倒逼理解）","第三段：方法（讲给别人、做项目、写总结）"],"es":"The saying that telling makes us forget, teaching makes us remember and involvement makes us learn describes a ladder that most students climb too slowly.\n\nListening is the weakest form because it creates a feeling of understanding without testing it. Teaching is stronger: to explain something, a person must select the essential points and arrange them in order, and the gaps become obvious in the attempt. Involvement is strongest because it requires decisions under conditions that cannot be fully anticipated, which is where real understanding is revealed.\n\nThe psychology agrees. Recall practice strengthens memory more than re-reading, and explaining forces recall at the level of structure rather than detail. This is why study groups often help the explainer more than the listener.\n\nThe practical implication is uncomfortable: the activities that feel least efficient — explaining to a classmate, writing a summary from memory, solving a problem without looking at the answer — are usually the ones that work.","ph":["climb too slowly 爬得太慢","the gaps become obvious 漏洞变得明显","The psychology agrees. 心理学研究也支持这一点。","The practical implication is uncomfortable 实践含义令人不适"]},{"id":"w057","tp":"名言评论","ti":"关于「简单」","dir":"Directions: Comment on the saying 'Simplicity is the ultimate sophistication.' Write an essay of 120 to 180 words.","ol":["解释「简单」不等于「容易」","说明简单背后的复杂工作","联系写作与设计"],"fr":["第一段：辨析简单与简陋","第二段：简单需要取舍与理解","第三段：在学习与写作中的应用"],"es":"The claim that simplicity is the ultimate sophistication is often misunderstood as a preference for the plain. In fact, simplicity is expensive: it is what remains after everything unnecessary has been removed.\n\nA simple explanation is not a short one; it is one in which the reader never has to hold two contradictory ideas at once. Producing it requires the writer to understand the subject well enough to decide what to leave out, and leaving things out is harder than adding them.\n\nThe opposite of simplicity is not complexity but clutter — complexity that serves no purpose. A medical textbook is complex because the body is complex; a form with twelve unnecessary fields is merely untidy.\n\nThe lesson for students is practical. When a summary grows longer than the original, the problem is not the subject but the understanding.","ph":["what remains after everything unnecessary has been removed 去掉一切不必要之物后剩下的东西","justify its place 证明自己该在这里","The opposite of simplicity is not complexity but clutter 简单的反面不是复杂，而是杂乱","grows longer than the original 比原文还长"]},{"id":"w058","tp":"名言评论","ti":"关于「好奇心」","dir":"Directions: Comment on the saying 'The important thing is not to stop questioning.' Write an essay of 120 to 180 words.","ol":["解释提问为何重要","说明提问能力如何被削弱","给出保持提问的方法"],"fr":["第一段：释义，提问是认知的起点","第二段：提问能力被什么削弱（效率压力、评价体系）","第三段：方法（记录疑问、追问一层）"],"es":"Einstein's advice not to stop question
